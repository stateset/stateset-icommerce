# Smithery Registry Configuration
# https://smithery.ai/docs/publishing

name: stateset-commerce
description: >
  The SQLite of Commerce — an embedded commerce engine serving 900+ MCP
  tools across 89 domains: orders, inventory, customers, products, carts
  and checkout, payments and refunds, returns/RMA, subscriptions,
  promotions, analytics and forecasting, a full finance suite (GL,
  month-end close, AP/AR, fixed assets, revenue recognition), warehouse
  management, traceability, EDI, and agent-to-agent commerce (x402,
  agent cards, escrow). Local-first: no API keys, no rate limits — the
  engine and its database run inside the server process.

version: 1.28.5
license: MIT OR Apache-2.0

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      DB_PATH:
        type: string
        description: Path to SQLite database file
        default: ./store.db
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '-p', '@stateset/cli@latest', 'stateset-mcp', '--db', config.DB_PATH || './store.db', '--profile', 'core'],
      env: {}
    })

tools:
  - list_customers
  - get_customer
  - create_customer
  - update_customer
  - list_orders
  - get_order
  - create_order
  - update_order_status
  - ship_order
  - cancel_order
  - list_products
  - get_product
  - create_product
  - get_stock
  - adjust_inventory
  - reserve_inventory
  - create_cart
  - add_cart_item
  - complete_checkout
  - get_sales_summary
  - get_demand_forecast
  - get_revenue_forecast
  - create_payment
  - create_refund
  - create_stablecoin_payment
  - x402_create_payment_intent
  - register_agent_card
  - discover_agents
  - a2a_pay
  - a2a_request_quote
  # ... representative sample — 900+ tools total; the generated catalog
  # lives at https://github.com/stateset/stateset-icommerce/blob/master/cli/docs/TOOLS.md

keywords:
  - commerce
  - ecommerce
  - orders
  - inventory
  - payments
  - subscriptions
  - analytics
  - ai-agents
  - a2a
  - x402
  - stablecoin
  - mcp-server

repository: https://github.com/stateset/stateset-icommerce
homepage: https://stateset.com
