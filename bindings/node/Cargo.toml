[package]
name = "stateset-embedded-node"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Node.js bindings for StateSet Embedded Commerce"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "2", features = ["async", "napi9", "serde-json"] }
napi-derive = "2"

# Our commerce library
stateset-embedded = { path = "../../crates/stateset-embedded", features = ["vector"], version = "1.1.0" }
stateset-core = { path = "../../crates/stateset-core", features = ["embeddings"], version = "1.1.0" }
stateset-db = { path = "../../crates/stateset-db", features = ["vector"], version = "1.1.0" }
stateset-crypto = { path = "../../crates/stateset-crypto", version = "1.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decimal handling
rust_decimal = { version = "1.36", features = ["serde"] }

# UUID handling
uuid = { version = "1", features = ["v4"] }

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread"] }

# Crypto (for NAPI wrappers)
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

[build-dependencies]
napi-build = "2"
