[package]
name = "stateset-embedded-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Node.js bindings for StateSet Embedded Commerce"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "2", features = ["async", "napi9", "serde-json"] }
napi-derive = "2"

# Our commerce library
stateset-embedded = { path = "../../crates/stateset-embedded" }
stateset-core = { path = "../../crates/stateset-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Decimal handling
rust_decimal = { version = "1.36", features = ["serde"] }

# UUID handling
uuid = { version = "1", features = ["v4"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
