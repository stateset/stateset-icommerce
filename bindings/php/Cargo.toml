[package]
name = "stateset-embedded-php"
version = "0.7.1"
edition = "2021"
description = "PHP bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "php", "woocommerce"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", package = "stateset-embedded" }
stateset-core = { path = "../../crates/stateset-core" }
ext-php-rs = "0.13"
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
