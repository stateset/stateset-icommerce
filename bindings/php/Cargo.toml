[package]
name = "stateset-embedded-php"
version = "1.0.1"
edition = "2021"
description = "PHP bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "php", "woocommerce"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]
doc = false

[features]
default = []
runtime = [
    "dep:chrono",
    "dep:ext-php-rs",
    "dep:rust_decimal",
    "dep:stateset-core",
    "dep:stateset-embedded",
]

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", package = "stateset-embedded", version = "1.0.1", optional = true }
stateset-core = { path = "../../crates/stateset-core", version = "1.0.1", optional = true }
ext-php-rs = { version = "0.13", optional = true }
rust_decimal = { version = "1.36", features = ["serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[workspace]
