[package]
name = "stateset-dotnet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native library for the StateSet .NET binding (re-exports the stateset-ffi C ABI)"
publish = false

[lib]
name = "stateset_dotnet"
crate-type = ["cdylib"]

[dependencies]
# The whole C ABI lives in stateset-ffi (JSON call surface + crypto exports);
# this crate only gives the shared library the name the .NET binding loads.
stateset-ffi = { path = "../../crates/stateset-ffi", version = "1.37.0" }

[lints]
workspace = true
