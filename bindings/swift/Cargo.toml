[package]
name = "stateset-swift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native library for the StateSet Swift binding (re-exports the stateset-ffi C ABI)"
publish = false

[lib]
name = "stateset_swift"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The whole C ABI lives in stateset-ffi (JSON call surface + crypto exports);
# this crate only gives the library the name the Swift module map links.
stateset-ffi = { path = "../../crates/stateset-ffi", version = "1.37.0" }

[lints]
workspace = true
