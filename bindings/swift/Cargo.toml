[package]
name = "stateset-swift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Swift C FFI bindings for StateSet Embedded Commerce"

[lib]
name = "stateset_swift"
crate-type = ["cdylib", "staticlib"]

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", version = "0.7.13" }
stateset-core = { path = "../../crates/stateset-core", version = "0.7.13" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
uuid = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

# C FFI helpers
libc = "0.2"

[build-dependencies]
cbindgen = "0.27"

[lints]
workspace = true
