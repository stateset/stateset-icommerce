[package]
name = "stateset-embedded-python"
version = "0.7.23"
edition = "2021"
description = "Python bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "python", "pyo3"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]
doc = false

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", package = "stateset-embedded", features = ["vector"], version = "0.7.23" }
stateset-core = { path = "../../crates/stateset-core", features = ["embeddings"], version = "0.7.23" }
stateset-primitives = { path = "../../crates/stateset-primitives", version = "0.7.23" }
stateset-db = { path = "../../crates/stateset-db", features = ["vector"], version = "0.7.23" }
pyo3 = { version = "0.24", features = ["extension-module"] }
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
serde_json = "1.0"
