[package]
name = "stateset-embedded-python"
version = "1.28.1"
edition = "2021"
description = "Python bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "python", "pyo3"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]
doc = false

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", package = "stateset-embedded", features = ["vector"], version = "1.28.1" }
stateset-core = { path = "../../crates/stateset-core", features = ["embeddings"], version = "1.28.1" }
stateset-primitives = { path = "../../crates/stateset-primitives", version = "1.28.1" }
stateset-db = { path = "../../crates/stateset-db", features = ["vector"], version = "1.28.1" }
stateset-sdk = { path = "../../crates/stateset-sdk", version = "1.28.1", default-features = false, features = ["sync"] }
stateset-crypto = { path = "../../crates/stateset-crypto", version = "1.28.1" }
hex = "0.4"
pyo3 = { version = "0.29", features = ["extension-module"] }
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
