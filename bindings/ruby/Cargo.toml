[package]
name = "stateset_embedded"
version = "1.29.0"
edition = "2021"
description = "Ruby bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "ruby", "magnus"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]
doc = false

[features]
default = []
runtime = [
    "dep:magnus",
    "dep:stateset-crypto",
    "dep:serde_json",
]

[dependencies]
magnus = { version = "0.7", optional = true }
stateset-crypto = { path = "../../crates/stateset-crypto", version = "1.29.0", optional = true }
serde_json = { version = "1.0", optional = true }

[workspace]
