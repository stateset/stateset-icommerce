[package]
name = "stateset_embedded"
version = "1.37.0"
edition = "2024"
rust-version = "1.85"
description = "Ruby bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "ruby", "magnus"]
categories = ["api-bindings"]
publish = false

[lib]
name = "stateset_embedded"
# `cdylib` is the Ruby extension; `rlib` lets `cargo test` exercise the
# engine dispatcher (src/dispatch.rs) without Ruby headers.
crate-type = ["cdylib", "rlib"]
doc = false

[features]
default = []
# The magnus glue (needs `ruby.h` via rb-sys). Everything else — the engine
# dispatcher, JSON marshalling, error classification — compiles and is
# unit-tested without a Ruby toolchain.
runtime = ["dep:magnus"]

[dependencies]
magnus = { version = "0.7", optional = true }
stateset-embedded = { path = "../../crates/stateset-embedded", version = "1.37.0", default-features = false, features = ["sqlite"] }
stateset-core = { path = "../../crates/stateset-core", version = "1.37.0" }
stateset-crypto = { path = "../../crates/stateset-crypto", version = "1.37.0" }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ignored = "0.1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

# Standalone workspace: building the extension needs Ruby headers, so this
# crate is excluded from the root workspace (see the root Cargo.toml).
[workspace]
