[package]
name = "stateset-embedded-ruby"
version = "0.9.2"
edition = "2021"
description = "Ruby bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
keywords = ["commerce", "ecommerce", "ruby", "magnus"]
categories = ["api-bindings"]

[lib]
name = "stateset_embedded"
crate-type = ["cdylib"]
doc = false

[features]
default = []
runtime = [
    "dep:chrono",
    "dep:magnus",
    "dep:rust_decimal",
    "dep:stateset-core",
    "dep:stateset-embedded",
]

[dependencies]
stateset-embedded = { path = "../../crates/stateset-embedded", package = "stateset-embedded", version = "0.9.2", optional = true }
stateset-core = { path = "../../crates/stateset-core", version = "0.9.2", optional = true }
magnus = { version = "0.7", optional = true }
rust_decimal = { version = "1.36", features = ["serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[workspace]
