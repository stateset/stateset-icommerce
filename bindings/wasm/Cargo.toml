[package]
name = "stateset-embedded-wasm"
version = "0.7.18"
edition = "2021"
description = "WASM bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stateset-core = { path = "../../crates/stateset-core", version = "0.7.18" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rust_decimal = { version = "1.36", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
thiserror = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
