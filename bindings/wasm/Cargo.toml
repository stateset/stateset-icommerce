[package]
name = "stateset-embedded-wasm"
version = "1.28.3"
edition = "2021"
description = "WASM bindings for StateSet Embedded Commerce"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stateset-core = { path = "../../crates/stateset-core", version = "1.28.3" }
stateset-pricing = { path = "../../crates/stateset-pricing", version = "1.28.3" }
stateset-crypto = { path = "../../crates/stateset-crypto", version = "1.28.3", default-features = false }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
rust_decimal = { workspace = true, features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
thiserror = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1.0"

[package.metadata.wasm-pack.profile.release]
# wasm-opt 1.x rejects newer WASM features used by some deps; disable until
# we adopt a newer wasm-opt (or switch to twiggy). The unoptimized binary is
# still ~1.5 MB and works fine for tests + node usage.
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
