services:
  web:
    platform: linux/amd64
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:${PILOT_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: "http://localhost:${PILOT_PORT:-3000}"
    volumes:
      - store:/var/lib/stateset
  operator:
    profiles: [tools]
    platform: linux/amd64
    build:
      context: .
      target: operator
    environment:
      NEXT_PUBLIC_BASE_URL: "http://localhost:${PILOT_PORT:-3000}"
    volumes:
      - store:/var/lib/stateset
volumes:
  store:
