# cargo-deny configuration
#
# Keep the policy strict enough to catch real issues while being pragmatic
# about known upstream problems with no fix.

[graph]
all-features = false
no-default-features = false

[advisories]
# Keep `cargo deny` strict (don't ignore advisories here). The CI `cargo audit`
# step owns documented temporary ignores for advisories that need runtime
# context or upstream fixes before they can be removed.
yanked = "warn"

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
# Ban OpenSSL usage. The workspace standardizes on rustls for TLS to keep
# container images small and release builds portable.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]
# Exact-version skips for known upstream transition duplicates. Keep these
# version-pinned so newly introduced duplicate versions still surface.
skip = [
  # RustCrypto/PQC stacks are mid-transition across digest 0.10 and 0.11 RCs.
  { name = "block-buffer", version = "=0.10.4" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "signature", version = "=2.2.0" },

  # rand/getrandom are split by upstream consumers until the ecosystem settles
  # on the 2024/2026 APIs.
  { name = "getrandom", version = "=0.2.17" },
  { name = "rand", version = "=0.8.5" },
  { name = "rand_core", version = "=0.6.4" },

  # Legacy proc-macro and map dependencies are held by upstream crates.
  { name = "hashbrown", version = "=0.14.5" },
  { name = "heck", version = "=0.4.1" },

  # Windows target crates are retained by old JNI/build-tooling dependencies.
  { name = "windows-sys", version = "=0.45.0" },
  { name = "windows-sys", version = "=0.52.0" },
  { name = "windows-targets", version = "=0.42.2" },
  { name = "windows_aarch64_gnullvm", version = "=0.42.2" },
  { name = "windows_aarch64_msvc", version = "=0.42.2" },
  { name = "windows_i686_gnu", version = "=0.42.2" },
  { name = "windows_i686_msvc", version = "=0.42.2" },
  { name = "windows_x86_64_gnu", version = "=0.42.2" },
  { name = "windows_x86_64_gnullvm", version = "=0.42.2" },
  { name = "windows_x86_64_msvc", version = "=0.42.2" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
