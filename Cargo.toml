[workspace]
resolver = "2"
members = [
    "crates/stateset-core",
    "crates/stateset-db",
    "crates/stateset-embedded",
    "crates/stateset-observability",
    "bindings/node",
    "bindings/python",
    "bindings/wasm",
    "bindings/ruby",
    "bindings/php",
    "bindings/java",
    "bindings/kotlin",
    "bindings/swift",
    "bindings/dotnet",
    "bindings/go",
]
# Bindings require extra toolchains (Node, Python, wasm-pack, JDK, etc.).
# Keep default-members focused on core crates to avoid unexpected build failures.
default-members = [
    "crates/stateset-core",
    "crates/stateset-db",
    "crates/stateset-embedded",
    "crates/stateset-observability",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stateset/stateset-icommerce"
authors = ["StateSet <support@stateset.com>"]

[workspace.dependencies]
# Core dependencies (minimal)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
thiserror = "1.0"
base64 = "0.22"
hex = "0.4"
serde_jcs = "0.1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
once_cell = "1.19"
prometheus = "0.14"


# Database (SQLite)
rusqlite = { version = "0.32.1", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Database (PostgreSQL)
# Avoid `sqlx` default features (notably `any`), which pull in MySQL and other
# unused database stacks. This keeps `cargo audit` green and dependency trees
# smaller while still supporting PostgreSQL.
sqlx = { version = "0.8.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "json", "uuid", "chrono", "rust_decimal", "tls-none"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTTP client (for embeddings service)
# Use rustls TLS to avoid a hard runtime dependency on OpenSSL (libssl.so.1.1),
# which breaks in minimal container images and newer distros.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Internal crates
stateset-core = { path = "crates/stateset-core", version = "0.7.0" }
stateset-db = { path = "crates/stateset-db", version = "0.7.0" }
stateset-embedded = { path = "crates/stateset-embedded", version = "0.7.0" }

# Note: Testing dependencies (criterion, proptest) are added to individual crates
