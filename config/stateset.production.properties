app_name=com.stateset.commerce

# Production baseline. Set secrets and restrict network exposure before use.
# Required: set security.auth.jwt_secret and api.cors.allowed_origins.

# Database Settings
db.type=sqlite
db.path=stateset.db
db.max_connections=10
db.connection_timeout=30

# Performance Settings
performance.precompile_statements=true
performance.cache_size=10000
performance.page_size=4096
performance.journal_mode=WAL
performance.synchronous_mode=NORMAL

# Observability Settings
observability.tracing.enabled=true
observability.tracing.otlp_endpoint=http://localhost:4317
observability.tracing.sample_rate=1.0
observability.metrics.enabled=true
observability.metrics.export_interval=15
observability.metrics.prometheus_port=9090

# Security Settings
security.rate_limit.requests_per_second=1000
security.rate_limit.burst=100
security.auth.enabled=true
# Required: set to a high-entropy secret via deployment config.
security.auth.jwt_secret=
security.rbac.enabled=true

# Migration Settings
migrations.auto=true
migrations.rollback=true
migrations.backup_before_migration=true

# Backup Settings
backup.enabled=true
backup.schedule=0 2 * * *  # Daily at 2 AM
backup.retention.days=30
backup.location=./backups
backup.compression=true

# Transaction Settings
transaction.timeout_sec=30
transaction.retry.max_attempts=3
transaction.retry.backoff_ms=100
transaction.saga.enabled=true
transaction.saga.timeout_sec=300

# API Settings
api.enabled=true
api.port=8080
api.host=127.0.0.1
api.cors.enabled=true
api.cors.allowed_origins=https://yourdomain.example

# WebSocket Settings
websocket.enabled=true
websocket.port=8081
websocket.max_connections=1000
websocket.heartbeat_interval=30000

# Cache Settings
cache.enabled=true
cache.type=memory
cache.ttl=300
cache.max_size=10000

# Logging Settings
logging.level=INFO
logging.format=json
logging.output=stdout

# Multi-Tenancy Settings
multitenancy.enabled=false
multitenancy.isolation_strategy=column
multitenancy.default_tenant=default

# Sharding Settings
sharding.enabled=false
sharding.strategy=hash
sharding.shard_count=10

# Agent Integration Settings
agents.enabled=true
agents.timeout_ms=5000
agents.max_concurrent=100
agents.retry.max_attempts=3
