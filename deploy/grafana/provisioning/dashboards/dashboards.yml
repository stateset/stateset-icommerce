# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'StateSet Dashboards'
    orgId: 1
    folder: 'StateSet'
    folderUid: 'stateset'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
