# StateSet iCommerce — PostgreSQL Backup CronJob
#
# Runs pg_dump daily at 02:00 UTC, compressing backups with gzip.
# Retains the last 7 daily backups, pruning older files automatically.
#
# Prerequisites:
#   - stateset-postgres-secrets Secret (username, password fields)
#   - stateset-postgres-config ConfigMap (POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB)
#   - stateset-postgres-backups PVC (defined below)
#
# To restore from a backup:
#   gunzip -c /backups/stateset-YYYY-MM-DD_HHMMSS.sql.gz | psql -U stateset -d stateset

---
# PVC for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stateset-postgres-backups
  namespace: stateset
  labels:
    app.kubernetes.io/name: stateset-postgres
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: stateset-icommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stateset-postgres-backup
  namespace: stateset
  labels:
    app.kubernetes.io/name: stateset-postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: stateset-icommerce
spec:
  # Daily at 02:00 UTC
  schedule: "0 2 * * *"
  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Auto-clean completed jobs after 24 hours
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stateset-postgres-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: stateset-postgres-config
                      key: POSTGRES_HOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: stateset-postgres-config
                      key: POSTGRES_PORT
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: stateset-postgres-config
                      key: POSTGRES_DB
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: stateset-postgres-secrets
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: stateset-postgres-secrets
                      key: password
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "7"
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  TIMESTAMP=$(date +%Y-%m-%d_%H%M%S)
                  BACKUP_FILE="${BACKUP_DIR}/stateset-${TIMESTAMP}.sql.gz"

                  echo "[$(date -Iseconds)] Starting PostgreSQL backup..."
                  echo "  Host: ${PGHOST}:${PGPORT}"
                  echo "  Database: ${PGDATABASE}"
                  echo "  Output: ${BACKUP_FILE}"

                  # Run pg_dump with compression
                  pg_dump \
                    --verbose \
                    --format=plain \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    --if-exists \
                    | gzip > "${BACKUP_FILE}"

                  # Verify backup file was created and is non-empty
                  if [ ! -s "${BACKUP_FILE}" ]; then
                    echo "[ERROR] Backup file is empty or missing!"
                    exit 1
                  fi

                  BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                  echo "[$(date -Iseconds)] Backup completed: ${BACKUP_FILE} (${BACKUP_SIZE})"

                  # Prune old backups beyond retention period
                  echo "[$(date -Iseconds)] Pruning backups older than ${RETENTION_DAYS} days..."
                  PRUNED=$(find "${BACKUP_DIR}" -name "stateset-*.sql.gz" -mtime +${RETENTION_DAYS} -print -delete | wc -l)
                  echo "[$(date -Iseconds)] Pruned ${PRUNED} old backup(s)"

                  # List remaining backups
                  echo "[$(date -Iseconds)] Current backups:"
                  ls -lh "${BACKUP_DIR}"/stateset-*.sql.gz 2>/dev/null || echo "  (none)"

                  echo "[$(date -Iseconds)] Backup job complete."
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: stateset-postgres-backups
