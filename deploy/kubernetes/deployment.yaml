# StateSet iCommerce Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateset-cli
  namespace: stateset
  labels:
    app.kubernetes.io/name: stateset-cli
    app.kubernetes.io/component: cli
    app.kubernetes.io/part-of: stateset-icommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stateset-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateset-cli
        app.kubernetes.io/component: cli
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stateset
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: stateset-cli
          image: stateset/icommerce-cli:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_PATH
              value: "/app/data/store.db"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: "9090"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stateset-secrets
                  key: anthropic-api-key
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stateset-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: stateset-cli
                topologyKey: kubernetes.io/hostname
---
# PostgreSQL Deployment (for production scaling)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateset-postgres
  namespace: stateset
  labels:
    app.kubernetes.io/name: stateset-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: stateset-icommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stateset-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateset-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "stateset"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stateset-postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stateset-postgres-secrets
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - stateset
                - -d
                - stateset
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - stateset
                - -d
                - stateset
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: stateset-postgres-data
