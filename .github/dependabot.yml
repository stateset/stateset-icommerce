version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/bindings/wasm"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bundler"
    directory: "/bindings/ruby"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/bindings/php"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/bindings/java/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/bindings/kotlin/kotlin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/bindings/dotnet/dotnet/StateSet"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/bindings/go/stateset"
    schedule:
      interval: "weekly"
