name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  omarchy-integration:
    name: Omarchy Plugin Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            bindings/node/package-lock.json
            cli/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Install root tooling
        run: HUSKY=0 npm ci
      - name: Install embedded binding dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build local embedded native binding
        working-directory: bindings/node
        run: npm run build:debug
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Check integration contracts and performance
        run: npm run check:omarchy
      - name: Build standalone plugin artifact
        run: npm run package:omarchy-plugin
      - name: Validate against pinned upstream Omarchy
        env:
          OMARCHY_REVISION: 83881e979b35468c3e7d60b171e319ede61a88fd
        run: |
          git clone --filter=blob:none https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout "$OMARCHY_REVISION"
          "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" dist/stateset-omarchy-plugin
      - name: Upload installable plugin
        uses: actions/upload-artifact@v6
        with:
          name: stateset-omarchy-plugin
          path: dist/stateset-omarchy-plugin
          if-no-files-found: error

  kernel-contract:
    name: AI Kernel Contract & Adversarial Evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stateset_kernel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stateset_kernel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/stateset_kernel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Install CLI dependencies for catalog verification
        working-directory: cli
        run: npm ci
      - name: Verify governed command coverage
        run: node scripts/ci/check_kernel_coverage.mjs
      - name: Run authority, policy, atomicity, replay, and tamper evals
        run: |
          cargo test --locked -p stateset-core kernel::tests
          cargo test --locked -p stateset-db --test sqlite_kernel_outbox
          cargo test --locked -p stateset-db --features postgres --test postgres_kernel_executor
          cargo test --locked -p stateset-db --test snapshot_migrations

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Clippy
        # Run clippy on default workspace members only (core crates). Bindings are
        # compiled/tested in their dedicated jobs with the required toolchains.
        run: cargo clippy --all-targets -- -D warnings

  clippy-features:
    name: Clippy (Features)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Clippy optional feature sets
        run: |
          cargo clippy -p stateset-core --features metrics --all-targets -- -D warnings
          cargo clippy -p stateset-db --no-default-features --features postgres --lib -- -D warnings
          cargo clippy -p stateset-db --no-default-features --features "postgres,saga" --lib -- -D warnings
          cargo clippy -p stateset-embedded --features postgres --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
        with:
          tool: cargo-audit
      - name: Security audit
        # RUSTSEC-2023-0071 affects `rsa` (pulled in via optional `sqlx-mysql`).
        # This workspace does not enable or ship MySQL support, and there is no
        # fixed upgrade available upstream.
        # RUSTSEC-2026-0097 affects `rand` when custom logging calls `rand::rng()`;
        # this workspace does not install such a logger. Keep this ignored until
        # upstream `rand` consumers converge on patched releases.
        # RUSTSEC-2026-0258 affects `h2` 0.3 (via tonic 0.11 / hyper 0.14), which only
        # enters the graph through stateset-observability's optional `otel` feature
        # (opentelemetry-otlp 0.16). Not compiled by default; clears when the OTLP
        # stack moves to opentelemetry-otlp >= 0.27 / tonic 0.12 (tracked upgrade).
        # RUSTSEC-2026-0235 affects `rkyv` 0.7, an OPTIONAL dependency of rust_decimal
        # that is present in Cargo.lock but never enabled by this workspace (we use
        # only the `serde` feature), so the vulnerable code is never compiled.
        run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0097
          --ignore RUSTSEC-2026-0258
          --ignore RUSTSEC-2026-0235

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
        with:
          tool: cargo-deny
      - name: cargo-deny
        run: cargo deny check

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check typos
        uses: crate-ci/typos@78bc6fb2c0d734235d57a2d6b9de923cc325ebdd

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Run shellcheck
        run: bash ./.github/scripts/shellcheck.sh

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: bash ./.github/scripts/actionlint.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check minimum supported Rust version
        run: |
          cargo check -p stateset-primitives --all-targets
          cargo check -p stateset-observability --all-targets
          cargo check -p stateset-test-utils --all-targets
          cargo check -p stateset-crypto --all-targets
          cargo check -p stateset-sync --all-targets
          cargo check -p stateset-core --features metrics --all-targets
          cargo check -p stateset-db --no-default-features --features postgres --all-targets
          cargo check -p stateset-db --no-default-features --features "postgres,saga" --all-targets
          cargo check -p stateset-embedded --features postgres --all-targets

  feature-checks:
    name: Feature Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check feature combinations
        run: |
          cargo check -p stateset-primitives --all-targets
          cargo check -p stateset-observability --all-targets
          cargo check -p stateset-test-utils --all-targets
          cargo check -p stateset-crypto --all-targets
          cargo check -p stateset-sync --all-targets
          cargo check -p stateset-core --features metrics --all-targets
          cargo check -p stateset-db --no-default-features --features postgres --all-targets
          cargo check -p stateset-db --no-default-features --features "postgres,saga" --all-targets
          cargo check -p stateset-embedded --features postgres --all-targets
          cargo check -p stateset-core --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flags: ["", "--no-default-features"]
    env:
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-tree-borrows -Zmiri-disable-isolation
      PROPTEST_CASES: "4"
      PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Run Miri
        run: |
          cargo +nightly miri test -p stateset-primitives --lib ${{ matrix.flags }}
          cargo +nightly miri test -p stateset-core --lib --features metrics ${{ matrix.flags }}

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check no_std support
        run: |
          rustup target add riscv32imac-unknown-none-elf
          cargo check --target riscv32imac-unknown-none-elf --no-default-features -p stateset-primitives

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript
            build-mode: none
          - language: rust
            # CodeQL's Rust extractor only supports build-mode `none`
            # (manual/autobuild are rejected as of CodeQL 2.25.x).
            build-mode: none
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  rust-docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        # Build docs for each crate with its supported features.
        # stateset-embedded with postgres triggers an sqlx Executor<'_>
        # lifetime issue in doc compilation, so build it without postgres.
        run: |
          cargo doc --no-deps --document-private-items \
            -p stateset-primitives --all-features
          cargo doc --no-deps --document-private-items \
            -p stateset-core --all-features
          cargo doc --no-deps --document-private-items \
            -p stateset-crypto
          cargo doc --no-deps --document-private-items \
            -p stateset-db --all-features
          cargo doc --no-deps --document-private-items \
            -p stateset-embedded
          cargo doc --no-deps --document-private-items \
            -p stateset-observability --all-features
          cargo doc --no-deps --document-private-items \
            -p stateset-policy -p stateset-a2a -p stateset-authz \
            -p stateset-jobs -p stateset-http -p stateset-pricing \
            -p stateset-macros -p stateset-test-utils \
            -p stateset-sync -p stateset-migrations

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - name: Install root tooling
        run: HUSKY=0 npm ci
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "0.4.40"
      - name: Validate docs release surfaces
        run: |
          npm run check:doc-tool-refs
          npm run check:docs:book
          npm run check:docs:snapshot

  release-hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - name: Install root tooling
        run: HUSKY=0 npm ci
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Check release hygiene
        run: bash ./scripts/ci/check_release_hygiene.sh
      - name: Test release hygiene helper
        run: bash ./scripts/ci/check_release_hygiene.test.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Compile optional feature sets
        run: |
          cargo check -p stateset-core --features metrics
          cargo check -p stateset-db --no-default-features --features postgres
          cargo check -p stateset-db --no-default-features --features "postgres,saga"
          cargo check -p stateset-embedded --features postgres

      - name: Test core crates
        run: |
          cargo test -p stateset-core -p stateset-db -p stateset-embedded
          cargo test -p stateset-observability -p stateset-integration-tests
          cargo test -p stateset-core --features metrics

      - name: Test protocol and crypto contracts
        # Keep the PQC wire/signing crates on the primary CI path instead of
        # relying on manual validation or downstream binding jobs.
        run: |
          cargo test -p stateset-crypto -p stateset-sync

      - name: Mutation Testing (Core)
        # Label-triggered only: a full mutation run over stateset-core takes hours,
        # far beyond what a per-push gate can afford. (The old master-push variant
        # also passed flags cargo-mutants does not have — `--test-threads`,
        # `--in-cargo-test-dir` — so it failed on argument parsing on every push
        # and made trunk permanently red.)
        if: >
          github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-mutants')
        run: |
          # Pin + --locked: newer cargo-mutants releases (27.x) resolve transitive
          # deps that raise the effective MSRV above the runner's stable rustc.
          # 25.3.1 declares MSRV 1.78 and builds clean against its committed lockfile.
          cargo install cargo-mutants --version 25.3.1 --locked
          # Second `--` forwards --test-threads to the test binaries themselves.
          cargo mutants -p stateset-core --timeout 300 -- -- --test-threads=1

  node-bindings:
    name: Node Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Check binding package
        working-directory: bindings/node
        run: npm run check

      - name: Smoke JS embedded engine examples
        run: node ./scripts/ci/check_engine_examples.mjs --js-only

      - name: Cross-binding parity (Node)
        # Verifies the Node napi binding produces byte-identical canonical-JSON,
        # payload-plain-hash and merkle-root output to Rust ground truth for
        # every vector in `bindings/test-vectors/v1.json`.
        working-directory: bindings/node
        run: node --test test/cross-binding-vectors.js

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install Python dependencies
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build extension module
        working-directory: bindings/python
        run: |
          maturin build --release --out dist
          python -m pip install dist/*.whl

      - name: Smoke Python bindings and agent examples
        run: bash scripts/ci/check_python_bindings.sh

      - name: Cross-binding parity (Python)
        # Verifies the PyO3 binding produces byte-identical canonical-JSON,
        # payload-plain-hash and merkle-root output to Rust ground truth for
        # every vector in `bindings/test-vectors/v1.json`. The wheel is
        # already installed by the previous step.
        working-directory: bindings/python
        run: python -m pytest tests/test_cross_binding_vectors.py -v

  postgres:
    name: Postgres Parity (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - db-postgres
          - db-postgres-saga
          - embedded-postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stateset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
      POSTGRES_PARITY_MODE: ${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run Postgres parity matrix
        run: ./scripts/ci/run_postgres_parity_matrix.sh

  ffi-sanitizers:
    name: FFI Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: nightly
          components: rust-src
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: ffi-sanitizer-${{ matrix.sanitizer }}

      - name: Run sanitizer lane
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          SANITIZER_TARGET: x86_64-unknown-linux-gnu
        run: ./scripts/ci/run_ffi_sanitizer.sh

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install embedded binding dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build local embedded native binding
        working-directory: bindings/node
        run: npm run build:debug

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Security audit
        working-directory: cli
        run: npm audit --omit=optional --audit-level=high

      - name: Install root tooling (ESLint, Prettier)
        # Disable husky git hook installation in CI.
        run: HUSKY=0 npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        working-directory: cli
        run: npm run lint

      - name: Typecheck (Supported Surface)
        working-directory: cli
        run: npm run typecheck:supported

      - name: Test
        working-directory: cli
        run: npm test

  ruby-bindings:
    name: Ruby Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Install Rust
        # Pin to the workspace toolchain (rust-toolchain.toml) so this binding
        # resolves dependencies exactly like the workspace. (The committed
        # Cargo.lock fix — pinning cfg-if to the real published 1.0.4 rather
        # than a phantom 1.1.0 — is what unblocks the build; this pin keeps the
        # binding aligned with the workspace toolchain going forward.)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.90"

      - name: Test
        working-directory: bindings/ruby
        run: bundle exec rake

  admin:
    name: Admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Typecheck Tests
        working-directory: admin
        run: npm run typecheck:tests

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Test
        working-directory: admin
        run: npm test

  admin-coverage:
    name: Admin Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Test with coverage
        working-directory: admin
        run: npm test -- --coverage

  go-bindings:
    name: Go Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build Go native library
        run: cargo build -p stateset-go --release

      - name: Run Go example
        working-directory: bindings/go/example
        run: go run ./

      - name: Cross-binding parity (Go)
        # Verifies the Go cgo binding produces byte-identical canonical-JSON,
        # payload-plain-hash and merkle-root output to Rust ground truth for
        # every vector in `bindings/test-vectors/v1.json`. The cdylib was
        # built by the previous step.
        working-directory: bindings/go/stateset
        run: go test -v ./...

  dotnet-bindings:
    name: .NET Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build .NET native library
        run: cargo build -p stateset-dotnet --release

      - name: Test
        working-directory: bindings/dotnet/tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: dotnet test

  jvm-bindings:
    name: JVM Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build Java native library
        run: cargo build -p stateset-java --release

      - name: Build Kotlin native library
        run: cargo build -p stateset-kotlin --release

      - name: Test Java binding
        working-directory: bindings/java/java
        run: gradle test

      - name: Test Kotlin binding
        working-directory: bindings/kotlin/kotlin
        run: gradle test

  swift-bindings:
    name: Swift Bindings
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Build Swift native library
        run: cargo build -p stateset-swift --release

      - name: Test
        working-directory: bindings/swift
        env:
          LIBRARY_PATH: ${{ github.workspace }}/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: swift test

  wasm-bindings:
    name: WASM Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build WASM crate
        run: cargo build -p stateset-embedded-wasm --target wasm32-unknown-unknown

      - name: Setup Node.js (for cross-binding test runner)
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version "^0.13"

      - name: Build WASM package for nodejs target
        # The bindings/wasm crate disables wasm-opt in profile metadata
        # because wasm-opt 1.x rejects newer WASM features used by deps.
        working-directory: bindings/wasm
        run: wasm-pack build --release --target nodejs --out-dir pkg-node

      - name: Cross-binding parity (WASM)
        # Verifies the wasm-bindgen binding produces byte-identical
        # canonical-JSON, payload-plain-hash and merkle-root output to Rust
        # ground truth for every vector in `bindings/test-vectors/v1.json`.
        working-directory: bindings/wasm
        run: node --test test/cross-binding-vectors.js

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview
          override: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Check stateset-db coverage floor
        # stateset-db is excluded from the workspace 80% gate below, but it must
        # not be floorless: this gate measures the db crate against its own test
        # suite. Baseline measured 2026-07-14: 52.05% lines. Ratchet this floor
        # up as db-crate coverage improves; do not lower it.
        env:
          STATESET_ALLOW_POSTGRES_SKIP: "1"
        run: |
          cargo llvm-cov \
            -p stateset-db \
            --fail-under-lines 50 \
            --ignore-filename-regex '(/tests/|/benches/)' \
            --summary-only

      - name: Generate code coverage
        env:
          STATESET_ALLOW_POSTGRES_SKIP: "1"
        run: |
          mkdir -p ./coverage
          cargo llvm-cov \
            --workspace \
            --cobertura \
            --output-path ./coverage/cobertura.xml \
            --fail-under-lines 80 \
            --ignore-filename-regex '(/tests/|/benches/|crates/stateset-db/|crates/stateset-embedded/src/async_commerce\.rs)' \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --features postgres

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: rust
          name: rust-coverage

  php-bindings:
    name: PHP Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Rust
        # Pin to the workspace toolchain (rust-toolchain.toml) so this binding
        # resolves dependencies exactly like the workspace. (The committed
        # Cargo.lock fix — pinning auto_impl to the real published 1.3.0 rather
        # than a phantom 1.5.0 — is what unblocks the build; this pin keeps the
        # binding aligned with the workspace toolchain going forward.)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.90"

      - name: Check package metadata
        working-directory: bindings/php
        run: composer validate --no-check-lock

      - name: Install PHP dependencies
        working-directory: bindings/php
        run: composer install --no-interaction --no-progress

      - name: Lint generated stubs
        working-directory: bindings/php
        run: php -l stubs/StateSet.php

      - name: Verify Composer autoload surface
        working-directory: bindings/php
        run: |
          php -r "require 'vendor/autoload.php'; exit(class_exists('StateSet\\\\Commerce') && class_exists('StateSet\\\\Crypto') ? 0 : 1);"

      - name: Build native PHP extension (runtime feature)
        # Compiles libstateset_embedded.so against the host PHP; ext-php-rs
        # uses php-config to discover headers. Required for the cross-binding
        # parity test which calls into the actual extension.
        working-directory: bindings/php
        run: cargo build --features runtime --release

      - name: Cross-binding parity (PHP)
        # Loads the freshly built extension and runs only the parity test.
        # The Crypto stub class would throw if the extension weren't loaded,
        # so this exercises the real ext-php-rs path end-to-end.
        working-directory: bindings/php
        run: |
          EXT_PATH="$(pwd)/target/release/libstateset_embedded.so"
          test -f "$EXT_PATH" || { echo "extension not built: $EXT_PATH"; exit 1; }
          php -d extension="$EXT_PATH" \
            vendor/bin/phpunit \
            --filter CryptoVectorTest \
            tests/CryptoVectorTest.php

  release-governance:
    name: Release Governance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [feature-checks]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Generate crate compatibility report
        env:
          COMPAT_REPORT_DIR: artifacts/compatibility
        run: ./scripts/ci/generate_compatibility_report.sh

      - name: Check generated release inventories
        run: |
          npm run check:agent-inventory
          npm run check:mcp-inventory
          npm run check:workspace-inventory

      - name: Upload compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: artifacts/compatibility

  benchmarks:
    name: Perf Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [rust]
    env:
      PERF_THRESHOLD_FILE: scripts/ci/perf-thresholds.json
      PERF_THRESHOLD_MULTIPLIER: ${{ vars.PERF_THRESHOLD_MULTIPLIER }}
      PERF_SAMPLE_SIZE: ${{ vars.PERF_SAMPLE_SIZE }}
      PERF_WARMUP_SECONDS: ${{ vars.PERF_WARMUP_SECONDS }}
      PERF_MEASUREMENT_SECONDS: ${{ vars.PERF_MEASUREMENT_SECONDS }}
      PERF_REPORT_PATH: artifacts/perf-regression/perf-regression-report.md
      PERF_REPORT_JSON_PATH: artifacts/perf-regression/perf-regression-report.json

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify perf evidence reporter
        run: ./scripts/ci/perf_regression_gate.test.sh

      - name: Run perf regression gate
        run: ./scripts/ci/perf_regression_gate.sh

      - name: Upload perf regression report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-regression-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/perf-regression
          if-no-files-found: error
          retention-days: 90

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - omarchy-integration
      - kernel-contract
      - fmt
      - clippy
      - clippy-features
      - audit
      - deny
      - dependency-review
      - typos
      - shellcheck
      - actionlint
      - msrv
      - feature-checks
      - miri
      - no-std
      - docs
      - release-hygiene
      - rust
      - node-bindings
      - python-bindings
      - postgres
      - ffi-sanitizers
      - cli
      - ruby-bindings
      - admin
      - admin-coverage
      - go-bindings
      - dotnet-bindings
      - jvm-bindings
      - swift-bindings
      - wasm-bindings
      - coverage
      - php-bindings
      - release-governance
      - benchmarks
      - codeql
      - rust-docs
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: dependency-review
