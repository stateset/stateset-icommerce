name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p stateset-core -p stateset-db -p stateset-embedded

      - name: Check (PostgreSQL feature)
        run: cargo check -p stateset-db --no-default-features --features postgres

  node-bindings:
    name: Node Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        run: npm run build -- --target x86_64-unknown-linux-gnu

      - name: Test
        working-directory: bindings/node
        run: npm test

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build extension module
        working-directory: bindings/python
        run: maturin develop --release

      - name: Test
        working-directory: bindings/python
        run: pytest -q
