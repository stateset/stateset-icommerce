name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Clippy
        # Run clippy on default workspace members only (core crates). Bindings are
        # compiled/tested in their dedicated jobs with the required toolchains.
        run: cargo clippy --all-targets -- -D warnings

  clippy-features:
    name: Clippy (Features)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          components: clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Clippy optional feature sets
        run: |
          cargo clippy -p stateset-core --features metrics --all-targets -- -D warnings
          cargo clippy -p stateset-db --no-default-features --features postgres --lib -- -D warnings
          cargo clippy -p stateset-db --no-default-features --features "postgres,saga" --lib -- -D warnings
          cargo clippy -p stateset-embedded --features postgres --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
      - name: Security audit
        # RUSTSEC-2023-0071 affects `rsa` (pulled in via optional `sqlx-mysql`).
        # This workspace does not enable or ship MySQL support, and there is no
        # fixed upgrade available upstream.
        run: cargo audit --ignore RUSTSEC-2023-0071

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-deny
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
      - name: cargo-deny
        run: cargo deny check

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check typos
        uses: crate-ci/typos@78bc6fb2c0d734235d57a2d6b9de923cc325ebdd

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)
      - name: Run shellcheck
        run: bash ./.github/scripts/shellcheck.sh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check minimum supported Rust version
        run: |
          cargo check -p stateset-primitives --all-targets
          cargo check -p stateset-observability --all-targets
          cargo check -p stateset-test-utils --all-targets
          cargo check -p stateset-core --features metrics --all-targets
          cargo check -p stateset-db --no-default-features --features postgres --all-targets
          cargo check -p stateset-db --no-default-features --features "postgres,saga" --all-targets
          cargo check -p stateset-embedded --features postgres --all-targets

  feature-checks:
    name: Feature Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check feature combinations
        run: |
          cargo check -p stateset-primitives --all-targets
          cargo check -p stateset-observability --all-targets
          cargo check -p stateset-test-utils --all-targets
          cargo check -p stateset-core --features metrics --all-targets
          cargo check -p stateset-db --no-default-features --features postgres --all-targets
          cargo check -p stateset-db --no-default-features --features "postgres,saga" --all-targets
          cargo check -p stateset-embedded --features postgres --all-targets
          cargo check -p stateset-core --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flags: ["", "--no-default-features"]
    env:
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Run Miri
        run: |
          cargo miri test -p stateset-primitives --lib ${{ matrix.flags }}
          cargo miri test -p stateset-core --lib --features metrics ${{ matrix.flags }}

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Check no_std support
        run: |
          rustup target add riscv32imac-unknown-none-elf
          cargo check --target riscv32imac-unknown-none-elf --no-default-features -p stateset-primitives

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript
            build-mode: none
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  rust-docs:
    name: Rust Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --document-private-items

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v1
        with:
          mdbook-version: "0.4.40"
      - name: Build docs
        run: mdbook build docs

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Compile optional feature sets
        run: |
          cargo check -p stateset-core --features metrics
          cargo check -p stateset-db --no-default-features --features postgres
          cargo check -p stateset-db --no-default-features --features "postgres,saga"
          cargo check -p stateset-embedded --features postgres

      - name: Test
        run: |
          cargo test -p stateset-core -p stateset-db -p stateset-embedded
          cargo test -p stateset-observability -p stateset-integration-tests
          cargo test -p stateset-core --features metrics

      - name: Mutation Testing (Core)
        if: >
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-mutants'))
        run: |
          cargo install cargo-mutants
          cargo mutants -p stateset-core --test-threads 1 --in-cargo-test-dir

  node-bindings:
    name: Node Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        run: npm run build -- --target x86_64-unknown-linux-gnu

      - name: Test
        working-directory: bindings/node
        run: npm test

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install Python dependencies
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build extension module
        working-directory: bindings/python
        run: maturin develop --release

      - name: Test
        working-directory: bindings/python
        run: pytest -q

  postgres:
    name: Postgres Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stateset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Test postgres migrations
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_migrations

      - name: Postgres Validations
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_validations

      - name: Postgres Order Transitions
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_order_transitions

      - name: Postgres Order Versioning
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_order_versioning

      - name: Postgres CRUD smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_crud

      - name: Postgres Agent Cards smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_agent_cards

      - name: Postgres x402 Credits smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_x402_credits

      - name: Postgres x402 Payment Intents smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_x402_payment_intents

      - name: Postgres AsyncCommerce smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-embedded --features postgres --test postgres_async_smoke

      - name: Postgres Cart Checkout smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-embedded --features postgres --test postgres_cart_checkout_smoke

      - name: Test postgres migrations (saga feature)
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features "postgres,saga" --test postgres_migrations

      - name: Postgres Saga smoke
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features "postgres,saga" --test postgres_saga

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Security audit
        working-directory: cli
        run: npm audit --audit-level=high

      - name: Install root tooling (ESLint, Prettier)
        # Disable husky git hook installation in CI.
        run: HUSKY=0 npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        working-directory: cli
        run: npm run lint

      - name: Typecheck
        working-directory: cli
        run: npm run typecheck

      - name: Test
        working-directory: cli
        run: npm test

  ruby-bindings:
    name: Ruby Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Test
        working-directory: bindings/ruby
        run: bundle exec rake

  admin:
    name: Admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ hashFiles('admin/package.json') != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Lint
        working-directory: admin
        run: npm run lint

      - name: Test
        working-directory: admin
        run: npm test

  go-bindings:
    name: Go Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build Go native library
        run: cargo build -p stateset-go --release

      - name: Run Go example
        working-directory: bindings/go/example
        run: go run ./

  dotnet-bindings:
    name: .NET Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build .NET native library
        run: cargo build -p stateset-dotnet --release

      - name: Test
        working-directory: bindings/dotnet/tests
        run: dotnet test

  jvm-bindings:
    name: JVM Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build Java native library
        run: cargo build -p stateset-java --release

      - name: Build Kotlin native library
        run: cargo build -p stateset-kotlin --release

      - name: Test Java binding
        working-directory: bindings/java/java
        run: gradle test

      - name: Test Kotlin binding
        working-directory: bindings/kotlin/kotlin
        run: gradle test

  swift-bindings:
    name: Swift Bindings
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-swift')

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Build Swift native library
        run: cargo build -p stateset-swift --release

      - name: Test
        working-directory: bindings/swift
        env:
          LIBRARY_PATH: ${{ github.workspace }}/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: swift test

  wasm-bindings:
    name: WASM Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build WASM crate
        run: cargo build -p stateset-embedded-wasm --target wasm32-unknown-unknown

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          override: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Generate code coverage
        run: |
          cargo tarpaulin \
            --out Xml \
            --output-dir ./coverage \
            --workspace \
            --fail-under 80 \
            --exclude-files '*/tests/*' \
            --exclude-files '*/benches/*' \
            --features postgres

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: rust
          name: rust-coverage

  php-bindings:
    name: PHP Bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - name: Build extension
        working-directory: bindings/php
        run: cargo build --release

      - name: Install PHP dependencies
        working-directory: bindings/php
        run: composer install

      - name: Test
        working-directory: bindings/php
        run: php -d extension=../../target/release/libstateset_embedded.so vendor/bin/phpunit tests/

  benchmarks:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run benchmarks
        run: |
          cargo bench -p stateset-core -p stateset-db -p stateset-embedded

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: target/criterion/report/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: true

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - clippy-features
      - audit
      - deny
      - dependency-review
      - typos
      - shellcheck
      - msrv
      - feature-checks
      - miri
      - no-std
      - docs
      - rust
      - node-bindings
      - python-bindings
      - postgres
      - cli
      - ruby-bindings
      - admin
      - go-bindings
      - dotnet-bindings
      - jvm-bindings
      - swift-bindings
      - wasm-bindings
      - coverage
      - php-bindings
      - benchmarks
      - codeql
      - rust-docs
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          jobs: ${{ toJSON(needs) }}
