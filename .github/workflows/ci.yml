name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Security audit
        run: cargo audit

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny
        run: cargo deny check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p stateset-core -p stateset-db -p stateset-embedded

      - name: Mutation Testing (Core)
        run: |
          cargo install cargo-mutants
          cargo mutants -p stateset-core --test-threads 1 --in-cargo-test-dir

      - name: Check (PostgreSQL feature)
        run: cargo check -p stateset-db --no-default-features --features postgres

  node-bindings:
    name: Node Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build native module
        working-directory: bindings/node
        run: npm run build -- --target x86_64-unknown-linux-gnu

      - name: Test
        working-directory: bindings/node
        run: npm test

  python-bindings:
    name: Python Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build extension module
        working-directory: bindings/python
        run: maturin develop --release

      - name: Test
        working-directory: bindings/python
        run: pytest -q

  postgres:
    name: Postgres Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stateset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test postgres migrations
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/stateset_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/stateset_test
        run: cargo test -p stateset-db --no-default-features --features postgres --test postgres_migrations

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Test
        working-directory: cli
        run: npm test

  ruby-bindings:
    name: Ruby Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: bindings/ruby
        run: bundle exec rake

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          override: true

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - uses: Swatinem/rust-cache@v2

      - name: Generate code coverage
        run: |
          cargo tarpaulin \
            --out Xml \
            --output-dir ./coverage \
            --workspace \
            --exclude-files '*/tests/*' \
            --exclude-files '*/benches/*' \
            --features postgres

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: rust
          name: rust-coverage

  php-bindings:
    name: PHP Bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build extension
        working-directory: bindings/php
        run: cargo build --release

      - name: Install PHP dependencies
        working-directory: bindings/php
        run: composer install

      - name: Test
        working-directory: bindings/php
        run: php -d extension=../../target/release/libstateset_embedded.so vendor/bin/phpunit tests/

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: [rust]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: |
          cargo tarpaulin --workspace --out Xml --exclude-files "bindings/*" --exclude-files "cli/*" --timeout 300

      - name: Upload to codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: true

  benchmarks:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    needs: [rust]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: |
          cargo bench -p stateset-core -p stateset-db -p stateset-embedded

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: target/criterion/report/index.html
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: true
