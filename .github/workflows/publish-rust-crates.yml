name: Publish Rust Crates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
      publish:
        description: 'Publish to crates.io (false runs dry-run only)'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  dry-run:
    name: Cargo Publish Dry Run
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: release_hygiene

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify publishability (dry run)
        run: bash ./scripts/publish-rust-crates.sh --dry-run

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: release_hygiene

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash ./scripts/publish-rust-crates.sh --publish
