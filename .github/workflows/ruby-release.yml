name: Ruby Release

on:
  push:
    tags:
      - 'ruby-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install root tooling
        run: HUSKY=0 npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby: '3.2'
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby: '3.1'
          - os: ubuntu-latest
            platform: x86_64-linux
            ruby: '3.0'
          # Linux aarch64
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            ruby: '3.2'
          # macOS x86_64
          - os: macos-13
            platform: x86_64-darwin
            ruby: '3.2'
          # macOS arm64
          - os: macos-14
            platform: arm64-darwin
            ruby: '3.2'
          # Windows
          - os: windows-latest
            platform: x64-mingw-ucrt
            ruby: '3.2'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Build native gem
        working-directory: bindings/ruby
        run: |
          bundle install
          bundle exec rake native gem

      - name: Upload gem
        uses: actions/upload-artifact@v6
        with:
          name: gem-${{ matrix.platform }}-ruby${{ matrix.ruby }}
          path: bindings/ruby/pkg/*.gem
          retention-days: 7
          if-no-files-found: error

  # Build source gem (no native extension, compiles on install)
  build-source:
    name: Build Source Gem
    runs-on: ubuntu-latest
    needs: release_hygiene
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Build source gem
        working-directory: bindings/ruby
        run: |
          bundle install
          gem build stateset_embedded.gemspec

      - name: Upload source gem
        uses: actions/upload-artifact@v6
        with:
          name: gem-source
          path: bindings/ruby/*.gem
          retention-days: 7
          if-no-files-found: error

  # Cross-compile for additional platforms using rb-sys-dock
  cross-build:
    name: Cross Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux-musl
          - aarch64-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install rb_sys
        run: gem install rb_sys

      - name: Cross compile
        working-directory: bindings/ruby
        run: |
          rb-sys-dock --platform ${{ matrix.platform }} -r 3.2 -- bundle exec rake native gem

      - name: Upload gem
        uses: actions/upload-artifact@v6
        with:
          name: gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*.gem
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to RubyGems
    needs: [release_hygiene, build, build-source, cross-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all gems
        uses: actions/download-artifact@v7
        with:
          path: gems
          pattern: gem-*
          merge-multiple: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Configure RubyGems credentials
        run: |
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Publish gems
        run: |
          for gem in gems/*.gem; do
            echo "Publishing $gem..."
            gem push "$gem"
          done

      - name: Generate release checksums
        run: |
          sha256sum gems/*.gem > release-checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            gems/*.gem
            release-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe
        with:
          files: |
            gems/*.gem
            release-checksums.txt
          generate_release_notes: true
          body: |
            ### Release verification
            ```text
            sha256sum -c release-checksums.txt
            ```
