name: Merchant storefront preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storefront-preview.yml'
      - 'scripts/create-storefront-preview.mjs'
      - 'scripts/pack-storefront-pilot.sh'
      - 'scripts/storefront-pilot/**'
      - 'scripts/storefront-native-notices/**'
      - 'scripts/pilot-scorecard*.mjs'
      - 'scripts/ci/storefront-preview.test.mjs'
      - 'scripts/ci/check_storefront_containers.sh'
      - 'packages/create-stateset-app/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Test the preview installer and pilot scorecard
        run: node --test scripts/ci/storefront-preview.test.mjs scripts/pilot-scorecard.test.mjs
      - name: Install the preview in a new project
        run: npm run storefront:preview -- "$RUNNER_TEMP/merchant-store"
      - name: Check the standalone pilot archive
        run: |
          bash scripts/pack-storefront-pilot.sh "$RUNNER_TEMP/pilot-download"
          cd "$RUNNER_TEMP/pilot-download"
          sha256sum -c SHA256SUMS
          tar -xzf stateset-merchant-pilot-*.tar.gz
          cd stateset-merchant-pilot
          docker compose --profile tools config --quiet
          npm ci --include=optional --no-audit --no-fund
          npm run verify:storefront
      - name: Reinstall from the relocated project and run merchant workflows
        run: |
          mv "$RUNNER_TEMP/merchant-store" "$RUNNER_TEMP/relocated-store"
          cd "$RUNNER_TEMP/relocated-store"
          echo '@stateset:registry=http://127.0.0.1:1' > "$RUNNER_TEMP/closed-registry.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/closed-registry.npmrc"
          export npm_config_cache="$RUNNER_TEMP/reinstall-cache"
          export npm_config_fetch_retries=0
          npm ci --include=optional --no-audit --no-fund
          npm run verify:storefront
      - name: Run operator and production web images with persistent storage
        run: |
          docker build --target operator -t merchant-operator "$RUNNER_TEMP/relocated-store"
          docker build --target runner -t merchant-web "$RUNNER_TEMP/relocated-store"
          scripts/ci/check_storefront_containers.sh merchant-operator merchant-web
