name: gitleaks

# Secret scanning over the full git history with the gitleaks binary.
#
# We invoke the binary directly instead of gitleaks/gitleaks-action@v2
# because the action requires a GITLEAKS_LICENSE org secret for repos under
# an organization; the binary itself is free and needs no license. The
# release tarball is version-pinned and checksum-verified, matching how
# other workflows in this repo pin downloaded artifacts.
#
# Scan shape: full history (`fetch-depth: 0` + `gitleaks git`) on every run.
# The whole history is ~43 MB and scans in ~3 s, so there is no need for
# PR-diff scoping via --log-opts. Findings are redacted in logs and in the
# uploaded SARIF report. Allowlisted false positives (doc placeholders,
# test fixtures) live in .gitleaks.toml, picked up automatically from the
# repo root.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
  # gitleaks_8.30.1_checksums.txt. Update together with GITLEAKS_VERSION.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  scan:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan full git history
        run: |
          gitleaks git . \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14
