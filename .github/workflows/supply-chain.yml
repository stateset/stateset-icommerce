name: supply-chain

# cargo-vet supply-chain audit. Verifies every dependency in the workspace
# has either an audit (first-party in `supply-chain/audits.toml`, or imported
# from trusted feeds in `supply-chain/config.toml`) or an explicit exemption
# in `supply-chain/config.toml`.
#
# Status: required. Bootstrap exemptions cover the existing dep tree, so the
# gate passes today. From this point forward, any *new* dependency added to
# the workspace must come with an audit, an import from a trusted feed, or
# an explicit exemption — otherwise this check fails the PR.
#
# To pay down exemptions, replace entries in `supply-chain/config.toml` with
# audits in `supply-chain/audits.toml` (`cargo vet certify <crate> <version>`).
#
# First-party `stateset-*` crates carry `audit-as-crates-io = false` in
# `supply-chain/config.toml`: they are path dependencies developed in this
# repo, and the crates.io releases are published from this same tree, so
# vetting our own source here would be circular — first-party review happens
# in PRs. (This rationale lives here because `cargo vet fmt` strips comments
# from the store files.)
#
# CI runs `cargo vet --locked` only, per the cargo-vet book's recommended CI
# setup, so the gate is deterministic against the committed store. To pull
# new audits from the trusted feeds, run `cargo vet` locally (which rewrites
# `supply-chain/imports.lock`) and commit the result.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    name: cargo vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-vet
        # Exact version pin; the store files in supply-chain/ were generated
        # and verified with this version. Bump deliberately.
        run: cargo install cargo-vet --version "0.10.2" --locked

      - name: Audit (required)
        # Required gate. Fails if any dependency in the workspace is not
        # covered by an audit, an imported audit, or an exemption. `--locked`
        # audits against the committed store without touching the network.
        run: cargo vet --locked
