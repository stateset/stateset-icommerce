name: Publish Python

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.28.1)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install root tooling
        run: HUSKY=0 npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  build-wheels:
    name: Build Wheels (py${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm covers linux-aarch64. Intel macOS wheels are
        # cross-compiled from the arm64 runner below (macos-13 Intel runners
        # queue indefinitely). Python 3.8 is EOL (Oct 2024) — users there fall
        # back to the sdist.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Build wheel
        working-directory: bindings/python
        run: maturin build --release --compatibility pypi -o dist

      # darwin-x64 wheels, cross-compiled: Apple's toolchain links fat-capable
      # objects from arm64 hosts, and maturin handles the target plumbing.
      - name: Build Intel macOS wheel (cross)
        if: matrix.os == 'macos-latest'
        working-directory: bindings/python
        run: |
          rustup target add x86_64-apple-darwin
          maturin build --release --compatibility pypi -o dist --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    needs: release_hygiene

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish To PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          path: dist
          name: sdist
          merge-multiple: true

      - name: Generate artifact checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.whl > release-checksums.txt

      - name: Attest published artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
            dist/release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: python-release-checksums
          path: dist/release-checksums.txt
          if-no-files-found: error

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Validate artifacts
        run: |
          python ./scripts/ci/check_python_binding_package.py bindings/python python --dist-dir dist
          # Only real distributions: release-checksums.txt lives in dist/ too,
          # and twine rejects it as an "unknown distribution format".
          python -m twine check --strict dist/*.tar.gz dist/*.whl

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload --non-interactive dist/*.tar.gz dist/*.whl
