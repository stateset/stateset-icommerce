name: Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace \
            --exclude stateset-node \
            --exclude stateset-python \
            --exclude stateset-wasm \
            --exclude stateset-ruby \
            --exclude stateset-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from llvm-cov summary
          COVERAGE=$(cargo llvm-cov --workspace \
            --exclude stateset-node \
            --exclude stateset-python \
            --exclude stateset-wasm \
            --exclude stateset-ruby \
            --exclude stateset-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --summary-only 2>/dev/null | grep -oP 'line.*?(\d+\.\d+)%' | grep -oP '\d+\.\d+' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not determine coverage"
            exit 0
          fi
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold"

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench -p stateset-core -p stateset-db -p stateset-embedded -- --noplot
