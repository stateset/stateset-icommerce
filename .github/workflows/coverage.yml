name: Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-embedded-ruby \
            --exclude stateset-embedded-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from llvm-cov summary
          COVERAGE=$(cargo llvm-cov --workspace \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-embedded-ruby \
            --exclude stateset-embedded-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --summary-only 2>/dev/null | grep -oP 'line.*?(\d+\.\d+)%' | grep -oP '\d+\.\d+' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "Could not determine coverage"
            exit 0
          fi
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold"

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench -p stateset-core -p stateset-db -p stateset-embedded -- --noplot

  cli-coverage:
    name: CLI Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Run coverage
        working-directory: cli
        run: npm run test:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: cli
        run: |
          # Node's --experimental-test-coverage outputs a summary like:
          #   line % | branch % | function %
          LINE_COV=$(grep -oP 'line.*?(\d+\.\d+)%' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "Could not determine line coverage — skipping threshold check"
            exit 0
          fi
          if (( $(echo "$LINE_COV < 60" | bc -l) )); then
            echo "::error::CLI line coverage ${LINE_COV}% is below 60% threshold"
            exit 1
          fi
          echo "CLI line coverage ${LINE_COV}% meets 60% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: cli/coverage
          if-no-files-found: warn
