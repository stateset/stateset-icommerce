name: Node Bindings Coverage

# The Rust workspace coverage gate, the Criterion benchmarks and the CLI
# coverage floor all live in ci.yml (jobs `coverage` / `Code Coverage`,
# `benchmarks` / `Perf Regression Gate` and `cli` / `CLI Tests`). This file
# used to run its own weaker copies of all three on every push and PR, so
# the workspace was measured twice and the CLI suite ran twice. Only the
# Node binding coverage floor, which ci.yml does not measure, remains.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  node-bindings-coverage:
    name: Node Bindings Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Run coverage
        working-directory: bindings/node
        # Explicit `shell: bash` enables pipefail so test failures are not
        # masked by the exit status of `tee`. This job intentionally runs
        # without the optional @stateset/cli peer stack; the toolkit
        # integration tests skip themselves (loudly) and the full toolkit
        # path is exercised by the `node-bindings` job in ci.yml.
        shell: bash
        run: npm run check:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: bindings/node
        run: |
          LINE_COV=$(grep -oP 'all files\s+\|\s+(\d+\.\d+)' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not determine Node bindings line coverage"
            exit 1
          fi
          if (( $(echo "$LINE_COV < 70" | bc -l) )); then
            echo "::error::Node bindings line coverage ${LINE_COV}% is below 70% threshold"
            exit 1
          fi
          echo "Node bindings line coverage ${LINE_COV}% meets 70% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-bindings-coverage
          path: bindings/node/coverage-output.txt
          if-no-files-found: error
