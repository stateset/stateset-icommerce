name: Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex '(/tests/|/benches/|crates/stateset-db/|crates/stateset-embedded/src/async_commerce\.rs)' \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        run: |
          cargo llvm-cov report \
            --json \
            --summary-only \
            --output-path coverage-summary.json \
            --ignore-filename-regex '(/tests/|/benches/|crates/stateset-db/|crates/stateset-embedded/src/async_commerce\.rs)'
          python3 - <<'PY'
          import json
          import sys

          with open("coverage-summary.json", encoding="utf-8") as handle:
              summary = json.load(handle)

          coverage = summary["data"][0]["totals"]["lines"]["percent"]
          print(f"Coverage: {coverage}%")
          if coverage < 80.0:
              print(f"::error::Coverage {coverage}% is below 80% threshold")
              sys.exit(1)
          print(f"Coverage {coverage}% meets threshold")
          PY

      - name: Check stateset-db coverage floor
        # Keep in sync with the db floor in ci.yml (baseline 52.05% on
        # 2026-07-14). Runs LAST: each cargo-llvm-cov test invocation clears
        # the shared profraw data, so this must not run between the workspace
        # measurement and its report/threshold steps.
        env:
          STATESET_ALLOW_POSTGRES_SKIP: "1"
        run: |
          cargo llvm-cov \
            -p stateset-db \
            --fail-under-lines 50 \
            --ignore-filename-regex '(/tests/|/benches/)' \
            --summary-only

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run benchmarks
        # Name the Criterion bench targets explicitly: a bare `cargo bench -p ...`
        # also runs each package's lib target under the libtest harness, which
        # rejects Criterion-only flags like `--noplot` with an
        # unrecognized-option error.
        run: |
          cargo bench -p stateset-core --bench core_benchmarks -- --noplot
          cargo bench -p stateset-db --bench db_benchmarks -- --noplot
          cargo bench -p stateset-embedded --bench api_benchmarks -- --noplot
          cargo bench -p stateset-embedded --bench performance_benchmarks -- --noplot

  cli-coverage:
    name: CLI Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      # The CLI's E2E tests exercise `--db :memory:` flows through
      # @stateset/embedded, which needs the locally built native binding —
      # same setup as the CI workflow's `cli` job.
      - name: Install embedded binding dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build local embedded native binding
        working-directory: bindings/node
        run: npm run build:debug

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Run coverage
        working-directory: cli
        # Explicit `shell: bash` enables pipefail so test failures are not
        # masked by the exit status of `tee`.
        shell: bash
        run: npm run test:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: cli
        run: |
          # Node's --experimental-test-coverage summary row looks like:
          #   # all files | 85.94 | 86.70 | 89.63 |
          # (columns: line %, branch %, funcs %; no % signs in the cells).
          LINE_COV=$(grep -E 'all files' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not determine CLI line coverage"
            exit 1
          fi
          if (( $(echo "$LINE_COV < 75" | bc -l) )); then
            echo "::error::CLI line coverage ${LINE_COV}% is below 75% threshold"
            exit 1
          fi
          echo "CLI line coverage ${LINE_COV}% meets 75% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-coverage
          # Node's built-in coverage reporter writes to stdout only; the tee'd
          # transcript is the artifact (there is no cli/coverage directory).
          path: cli/coverage-output.txt
          if-no-files-found: error

  node-bindings-coverage:
    name: Node Bindings Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Run coverage
        working-directory: bindings/node
        # Explicit `shell: bash` enables pipefail so test failures are not
        # masked by the exit status of `tee`. This job intentionally runs
        # without the optional @stateset/cli peer stack; the toolkit
        # integration tests skip themselves (loudly) and the full toolkit
        # path is exercised by the `node-bindings` job in ci.yml.
        shell: bash
        run: npm run check:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: bindings/node
        run: |
          LINE_COV=$(grep -oP 'all files\s+\|\s+(\d+\.\d+)' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not determine Node bindings line coverage"
            exit 1
          fi
          if (( $(echo "$LINE_COV < 70" | bc -l) )); then
            echo "::error::Node bindings line coverage ${LINE_COV}% is below 70% threshold"
            exit 1
          fi
          echo "Node bindings line coverage ${LINE_COV}% meets 70% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: node-bindings-coverage
          path: bindings/node/coverage-output.txt
          if-no-files-found: error
