name: Code Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e67dedb5e3c590e1c9d9272ace46ef689da250d
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-embedded-ruby \
            --exclude stateset-embedded-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        run: |
          # Extract coverage percentage from llvm-cov summary
          COVERAGE=$(cargo llvm-cov --workspace \
            --exclude stateset-embedded-node \
            --exclude stateset-embedded-python \
            --exclude stateset-embedded-wasm \
            --exclude stateset-embedded-ruby \
            --exclude stateset-embedded-php \
            --exclude stateset-java \
            --exclude stateset-kotlin \
            --exclude stateset-swift \
            --exclude stateset-dotnet \
            --exclude stateset-go \
            --summary-only 2>/dev/null | grep -oP 'line.*?(\d+\.\d+)%' | grep -oP '\d+\.\d+' | head -1)
          echo "Coverage: ${COVERAGE}%"
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not determine Rust workspace coverage"
            exit 1
          fi
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below 80% threshold"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold"

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run benchmarks
        run: cargo bench -p stateset-core -p stateset-db -p stateset-embedded -- --noplot

  cli-coverage:
    name: CLI Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Run coverage
        working-directory: cli
        run: npm run test:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: cli
        run: |
          # Node's --experimental-test-coverage outputs a summary like:
          #   line % | branch % | function %
          LINE_COV=$(grep -oP 'line.*?(\d+\.\d+)%' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not determine CLI line coverage"
            exit 1
          fi
          if (( $(echo "$LINE_COV < 75" | bc -l) )); then
            echo "::error::CLI line coverage ${LINE_COV}% is below 75% threshold"
            exit 1
          fi
          echo "CLI line coverage ${LINE_COV}% meets 75% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cli-coverage
          path: cli/coverage
          if-no-files-found: error

  node-bindings-coverage:
    name: Node Bindings Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Run coverage
        working-directory: bindings/node
        run: npm run check:coverage 2>&1 | tee coverage-output.txt

      - name: Check coverage threshold
        working-directory: bindings/node
        run: |
          LINE_COV=$(grep -oP 'all files\s+\|\s+(\d+\.\d+)' coverage-output.txt | grep -oP '\d+\.\d+' | head -1)
          echo "Line coverage: ${LINE_COV:-unknown}%"
          if [ -z "$LINE_COV" ]; then
            echo "::error::Could not determine Node bindings line coverage"
            exit 1
          fi
          if (( $(echo "$LINE_COV < 70" | bc -l) )); then
            echo "::error::Node bindings line coverage ${LINE_COV}% is below 70% threshold"
            exit 1
          fi
          echo "Node bindings line coverage ${LINE_COV}% meets 70% threshold"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: node-bindings-coverage
          path: bindings/node/coverage-output.txt
          if-no-files-found: error
