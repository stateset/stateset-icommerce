name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.28.2)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install root tooling
        run: HUSKY=0 npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  # Build native bindings for all platforms
  build-bindings:
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    # Linux targets all build inside a napi-rs image (matrix.docker): alpine for
    # musl, debian (bullseye, glibc 2.31) for gnu. The gnu lanes MUST NOT build on
    # the bare ubuntu-latest runner — its glibc is far newer than the oldest
    # supported consumer, and the produced .node then fails to load at require()
    # time on Ubuntu 20.04 / Debian 11 / RHEL 8 with
    # "version `GLIBC_2.34' not found". The glibc ceiling check below enforces it.
    # Empty for macOS/Windows.
    container: ${{ matrix.docker }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ !matrix.docker }}
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Rust
        if: ${{ !matrix.docker }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the repo toolchain, so cargo uses THAT toolchain,
      # not the one the action installed targets into. Add the target std to
      # whatever toolchain is active — this is what failed every cross build
      # with `can't find crate for core`.
      - name: Add target to the active (pinned) toolchain
        run: rustup target add ${{ matrix.target }}

      # The napi debian-aarch64 image already ships the aarch64 cross toolchain,
      # so nothing to install there (and it has no sudo).

      # napi cross-links the aarch64 musl lane through zig, which the alpine
      # image does not ship; without it the build silently falls back to the
      # host linker and dies at link time.
      - name: Install zig (aarch64 musl cross-link)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: apk add --no-cache zig

      - name: Build native module
        working-directory: bindings/node
        # bash explicitly: the docker branch uses POSIX [ -n ] tests, and the
        # Windows runners default to PowerShell.
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-unknown-linux-gnu-gcc
        # Inside the napi alpine image (Node 18) the `prebuild` check:env gate
        # rejects the container's Node. The gate protects the dev/runtime
        # environment; the produced .node artifact is NAPI-ABI stable, so the
        # container lane invokes napi directly and skips npm lifecycle hooks.
        run: |
          npm ci
          if [ -n "${{ matrix.docker }}" ]; then
            extra_args=()
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              extra_args+=(--zig)
            fi
            npx napi build --platform --release --target "${{ matrix.target }}" "${extra_args[@]}"
          else
            npm run build -- --target ${{ matrix.target }}
          fi

      # A .node built against a newer glibc than the oldest supported consumer
      # installs fine and then dies at require() with "version `GLIBC_2.xx' not
      # found". Nothing else in CI can catch that: every runner has a new glibc.
      # This gate fails the release instead of shipping a silently broken binary.
      - name: Check glibc ceiling (gnu Linux targets)
        if: endsWith(matrix.target, '-unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        env:
          MAX_GLIBC: '2.31'
        run: |
          set -euo pipefail
          command -v objdump >/dev/null || { apt-get update && apt-get install -y binutils; }
          status=0
          for f in *.node; do
            highest=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 | sed 's/GLIBC_//')
            [ -z "$highest" ] && { echo "$f: no glibc symbols (static?) - ok"; continue; }
            echo "$f requires glibc <= $highest (ceiling $MAX_GLIBC)"
            if [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$highest" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error file=$f::requires GLIBC_$highest, above the $MAX_GLIBC ceiling; it will fail to load on Ubuntu 20.04 / Debian 11 / RHEL 8. Build this target in the napi-rs debian image."
              status=1
            fi
          done
          exit $status

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish @stateset/embedded
  publish-embedded:
    needs: build-bindings
    runs-on: ubuntu-latest
    name: Publish @stateset/embedded
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: bindings/node/artifacts
          pattern: bindings-*

      - name: Move artifacts into platform packages
        working-directory: bindings/node
        # Per-platform distribution: napi artifacts routes each downloaded
        # .node into its npm/<platform>/ subpackage. The main package ships no
        # binaries and declares the platform packages as optionalDependencies,
        # so npm installs exactly one (~20-26 MB) instead of a 184 MB bundle.
        run: |
          npm ci
          npx napi artifacts
          ls -l npm/*/

      # check:package imports @stateset/embedded/agent-toolkit, whose published
      # @stateset/cli peer is not on npm yet at publish time, so it falls back
      # to the workspace CLI — which needs the CLI's own dependencies.
      - name: Install CLI dependencies (workspace toolkit fallback)
        working-directory: cli
        run: npm ci

      - name: Validate assembled package
        working-directory: bindings/node
        run: npm run check:package

      - name: Generate release checksums
        run: |
          cd bindings/node
          sha256sum -- npm/*/*.node > release-checksums.txt

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            bindings/node/npm/*/*.node
            bindings/node/release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-embedded-release-checksums
          path: bindings/node/release-checksums.txt
          if-no-files-found: error

      - name: Publish platform packages
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Explicit per-directory publish: `napi prepublish` (v2 CLI) exited in
        # 0.4s without publishing anything in the 1.25.0 run. Idempotent so a
        # partially published release can be resumed.
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            published=$(npm view "${name}@${version}" version 2>/dev/null || true)
            if [ "${published}" = "${version}" ]; then
              echo "${name}@${version} already published; skipping"
              continue
            fi
            ls "${dir}"*.node >/dev/null 2>&1 || { echo "missing binary in ${dir}" >&2; exit 1; }
            (cd "${dir}" && npm publish --access public --provenance)
          done

      - name: Wait for platform package availability
        working-directory: bindings/node
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            for attempt in {1..80}; do
              published=$(npm view "${name}@${version}" version 2>/dev/null || true)
              if [ "${published}" = "${version}" ]; then
                echo "${name}@${version} is available"
                break
              fi
              if [ "${attempt}" -eq 80 ]; then
                echo "${name}@${version} did not become available" >&2
                exit 1
              fi
              sleep 15
            done
          done

      - name: Publish to npm
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "${name}@${version}" version 2>/dev/null || true)
          if [ "${published}" = "${version}" ]; then
            echo "${name}@${version} already published; skipping"
          else
            npm publish --access public --provenance
          fi

  # Publish @stateset/cli
  publish-cli:
    needs: publish-embedded
    runs-on: ubuntu-latest
    name: Publish @stateset/cli
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Create npm package
        working-directory: cli
        run: |
          npm pack --silent

      - name: Create standalone Omarchy plugin
        run: |
          version=$(node -p "require('./cli/package.json').version")
          node scripts/package-omarchy-plugin.mjs
          tar -C dist -czf "stateset-omarchy-plugin-${version}.tar.gz" stateset-omarchy-plugin

      - name: Generate release checksums
        run: |
          cd cli
          sha256sum -- *.tgz > ../cli-release-checksums.txt
          cd ..
          sha256sum -- stateset-omarchy-plugin-*.tar.gz >> cli-release-checksums.txt

      - name: Attest package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cli/*.tgz
            stateset-omarchy-plugin-*.tar.gz
            cli-release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-package-release-checksums
          path: cli-release-checksums.txt
          if-no-files-found: error

      - name: Publish standalone Omarchy plugin
        uses: actions/upload-artifact@v6
        with:
          name: stateset-omarchy-plugin-release
          path: stateset-omarchy-plugin-*.tar.gz
          if-no-files-found: error

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@stateset/cli@${version}" version 2>/dev/null || true)
          if [ "${published}" = "${version}" ]; then
            echo "@stateset/cli@${version} already published; skipping"
          else
            npm publish --access public --provenance
          fi

  # Publish the storefront generator only after its native dependency exists.
  publish-create-stateset-app:
    needs: publish-embedded
    runs-on: ubuntu-latest
    name: Publish create-stateset-app
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Test generator
        working-directory: packages/create-stateset-app
        run: npm test

      - name: Pack generator
        working-directory: packages/create-stateset-app
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Wait for embedded package availability
        run: |
          version=$(node -p "require('./bindings/node/package.json').version")
          for attempt in {1..12}; do
            published=$(npm view "@stateset/embedded@${version}" version 2>/dev/null || true)
            if [ "${published}" = "${version}" ]; then
              exit 0
            fi
            echo "Waiting for @stateset/embedded@${version} to become available (attempt ${attempt}/12)"
            sleep 10
          done
          echo "@stateset/embedded@${version} did not become available" >&2
          exit 1

      - name: Smoke-test generated storefront
        env:
          SMOKE_DIR: ${{ runner.temp }}/stateset-storefront-smoke
        run: |
          node --input-type=module -e "import { scaffold } from './packages/create-stateset-app/src/index.js'; await scaffold({ projectName: 'stateset-storefront-smoke', storeName: 'StateSet Smoke Store', targetDir: process.env.SMOKE_DIR, skipInstall: true, pm: 'npm' });"
          cd "$SMOKE_DIR"
          npm install
          npm audit --audit-level=moderate
          npm run typecheck
          npm run build

      - name: Attest package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/create-stateset-app-*.tgz

      - name: Publish to npm
        working-directory: packages/create-stateset-app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "create-stateset-app@${version}" version 2>/dev/null || true)
          if [ "${published}" = "${version}" ]; then
            echo "create-stateset-app@${version} already published; skipping"
          else
            npm publish --access public --provenance
          fi

  # Registry-resolved internal dependencies cannot be updated in lockfiles
  # until the matching npm packages exist. Reconcile them after publication
  # and send the deterministic result through the normal protected-branch CI.
  sync-npm-lockfiles:
    needs: [publish-cli, publish-create-stateset-app]
    runs-on: ubuntu-latest
    name: Open npm lockfile sync PR
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Regenerate registry-backed lockfiles
        run: bash scripts/release-bump.sh --sync-locks

      - name: Enforce lockfile-only scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(bindings/node|bindings/wasm|cli|admin|examples/node)/package-lock\.json$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Lock synchronization changed files outside the allowlist:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit and open protected-branch PR
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./cli/package.json').version")
          branch="automation/sync-locks-v${version}"

          if git diff --quiet; then
            echo "No lockfile changes are required for v${version}."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add \
            bindings/node/package-lock.json \
            bindings/wasm/package-lock.json \
            cli/package-lock.json \
            admin/package-lock.json \
            examples/node/package-lock.json
          git commit -m "chore: sync npm lockfiles for v${version}"

          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"

          pr=$(gh pr list --head "$branch" --base master --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: sync npm lockfiles for v${version}" \
              --body "Automated post-publish lockfile reconciliation for v${version}. Registry-backed StateSet dependencies are updated only after their packages are publicly available."
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch CI for the automation branch
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./cli/package.json').version")
          gh workflow run ci.yml --ref "automation/sync-locks-v${version}"
