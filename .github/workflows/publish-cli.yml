name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.23.6)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install root tooling
        run: HUSKY=0 npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  # Build native bindings for all platforms
  build-bindings:
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    # musl targets build inside the napi-rs alpine image (matrix.docker), which
    # ships node + rustup with musl toolchains. Empty for the other targets.
    container: ${{ matrix.docker }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ !matrix.docker }}
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Rust
        if: ${{ !matrix.docker }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the repo toolchain, so cargo uses THAT toolchain,
      # not the one the action installed targets into. Add the target std to
      # whatever toolchain is active — this is what failed every cross build
      # with `can't find crate for core`.
      - name: Add target to the active (pinned) toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # napi cross-links the aarch64 musl lane through zig, which the alpine
      # image does not ship; without it the build silently falls back to the
      # host linker and dies at link time.
      - name: Install zig (aarch64 musl cross-link)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: apk add --no-cache zig

      - name: Build native module
        working-directory: bindings/node
        # bash explicitly: the docker branch uses POSIX [ -n ] tests, and the
        # Windows runners default to PowerShell.
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        # Inside the napi alpine image (Node 18) the `prebuild` check:env gate
        # rejects the container's Node. The gate protects the dev/runtime
        # environment; the produced .node artifact is NAPI-ABI stable, so the
        # container lane invokes napi directly and skips npm lifecycle hooks.
        run: |
          npm ci
          if [ -n "${{ matrix.docker }}" ]; then
            extra_args=()
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              extra_args+=(--zig)
            fi
            npx napi build --platform --release --target "${{ matrix.target }}" "${extra_args[@]}"
          else
            npm run build -- --target ${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish @stateset/embedded
  publish-embedded:
    needs: build-bindings
    runs-on: ubuntu-latest
    name: Publish @stateset/embedded
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: bindings/node/artifacts
          pattern: bindings-*

      - name: Move artifacts into platform packages
        working-directory: bindings/node
        # Per-platform distribution: napi artifacts routes each downloaded
        # .node into its npm/<platform>/ subpackage. The main package ships no
        # binaries and declares the platform packages as optionalDependencies,
        # so npm installs exactly one (~20-26 MB) instead of a 184 MB bundle.
        run: |
          npm ci
          npx napi artifacts
          ls -l npm/*/

      # check:package imports @stateset/embedded/agent-toolkit, whose published
      # @stateset/cli peer is not on npm yet at publish time, so it falls back
      # to the workspace CLI — which needs the CLI's own dependencies.
      - name: Install CLI dependencies (workspace toolkit fallback)
        working-directory: cli
        run: npm ci

      - name: Validate assembled package
        working-directory: bindings/node
        run: npm run check:package

      - name: Generate release checksums
        run: |
          cd bindings/node
          sha256sum -- npm/*/*.node > release-checksums.txt

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            bindings/node/npm/*/*.node
            bindings/node/release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-embedded-release-checksums
          path: bindings/node/release-checksums.txt
          if-no-files-found: error

      - name: Publish platform packages
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Explicit per-directory publish: `napi prepublish` (v2 CLI) exited in
        # 0.4s without publishing anything in the 1.23.6 run. Idempotent so a
        # partially published release can be resumed.
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
              continue
            fi
            ls "${dir}"*.node >/dev/null 2>&1 || { echo "missing binary in ${dir}" >&2; exit 1; }
            (cd "${dir}" && npm publish --access public --provenance)
          done

      - name: Publish to npm
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already published; skipping"
          else
            npm publish --access public --provenance
          fi

  # Publish @stateset/cli
  publish-cli:
    needs: publish-embedded
    runs-on: ubuntu-latest
    name: Publish @stateset/cli
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Create npm package
        working-directory: cli
        run: |
          npm pack --silent

      - name: Generate release checksums
        run: |
          cd cli
          sha256sum -- *.tgz > ../cli-release-checksums.txt

      - name: Attest package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cli/*.tgz
            cli-release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-package-release-checksums
          path: cli-release-checksums.txt
          if-no-files-found: error

      - name: Publish to npm
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@stateset/cli@${version}" version >/dev/null 2>&1; then
            echo "@stateset/cli@${version} already published; skipping"
          else
            npm publish --access public --provenance
          fi
