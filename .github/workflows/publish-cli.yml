name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build native bindings for all platforms
  build-bindings:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native module
        working-directory: bindings/node
        run: |
          npm install
          npm run build -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish @stateset/embedded
  publish-embedded:
    needs: build-bindings
    runs-on: ubuntu-latest
    name: Publish @stateset/embedded

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/node/artifacts
          pattern: bindings-*

      - name: Move artifacts
        working-directory: bindings/node
        run: |
          npm install
          npm run artifacts

      - name: Publish to npm
        working-directory: bindings/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish @stateset/cli
  publish-cli:
    needs: publish-embedded
    runs-on: ubuntu-latest
    name: Publish @stateset/cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: cli
        run: npm install

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Update install.sh on website
  deploy-install-script:
    needs: publish-cli
    runs-on: ubuntu-latest
    name: Deploy install.sh

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to stateset.com
        run: |
          echo "Deploy cli/install.sh to https://stateset.com/install.sh"
          # This would use your deployment method:
          # - S3 + CloudFront
          # - Vercel
          # - Cloudflare Pages
          # - Or just commit to your website repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
