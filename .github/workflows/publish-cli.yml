name: Publish CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release_hygiene:
    name: Release Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Check release hygiene
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: bash ./scripts/ci/check_release_hygiene.sh

  # Build native bindings for all platforms
  build-bindings:
    needs: release_hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native module
        working-directory: bindings/node
        run: |
          npm ci
          npm run build -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # Publish @stateset/embedded
  publish-embedded:
    needs: build-bindings
    runs-on: ubuntu-latest
    name: Publish @stateset/embedded
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: bindings/node/artifacts
          pattern: bindings-*

      - name: Move artifacts
        working-directory: bindings/node
        run: |
          npm ci
          npm run artifacts

      - name: Validate assembled package
        working-directory: bindings/node
        run: npm run check:package

      - name: Generate release checksums
        run: |
          cd bindings/node/artifacts
          sha256sum *.node > ../release-checksums.txt

      - name: Attest artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            bindings/node/artifacts/*.node
            bindings/node/release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-embedded-release-checksums
          path: bindings/node/release-checksums.txt
          if-no-files-found: error

      - name: Publish to npm
        working-directory: bindings/node
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish @stateset/cli
  publish-cli:
    needs: publish-embedded
    runs-on: ubuntu-latest
    name: Publish @stateset/cli
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: cli
        run: npm ci

      - name: Create npm package
        working-directory: cli
        run: |
          npm pack --silent

      - name: Generate release checksums
        run: |
          cd cli
          sha256sum *.tgz > ../cli-release-checksums.txt

      - name: Attest package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cli/*.tgz
            cli-release-checksums.txt

      - name: Publish checksums
        uses: actions/upload-artifact@v6
        with:
          name: cli-package-release-checksums
          path: cli-release-checksums.txt
          if-no-files-found: error

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
