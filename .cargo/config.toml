# Build configuration for StateSet iCommerce.
#
# target-cpu=native enables all CPU-specific instructions (AVX2, SHA-NI, etc.)
# for maximum performance on the build machine. For portable binaries,
# remove or change to a specific target (e.g., x86-64-v3).

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=native"]

[target.'cfg(target_arch = "aarch64")']
rustflags = ["-C", "target-cpu=native"]
