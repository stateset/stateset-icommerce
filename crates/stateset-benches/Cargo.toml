[package]
name = "stateset-benches"
description = "Cross-crate benchmark suite for StateSet iCommerce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
stateset-primitives = { path = "../stateset-primitives", version = "1.0.3" }
stateset-core = { path = "../stateset-core", version = "1.0.3" }
stateset-crypto = { path = "../stateset-crypto", version = "1.0.3", features = ["pqc"] }
stateset-db = { path = "../stateset-db", version = "1.0.3", features = ["sqlite"] }
stateset-embedded = { path = "../stateset-embedded", version = "1.0.3", features = ["sqlite", "events"] }
stateset-http = { path = "../stateset-http", version = "1.0.3" }
stateset-policy = { path = "../stateset-policy", version = "1.0.3" }
serde_json = { workspace = true }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
uuid = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = "1.36"
chrono = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
tokio = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "money_arithmetic"
harness = false

[[bench]]
name = "merkle_tree"
harness = false

[[bench]]
name = "jcs_canonicalize"
harness = false

[[bench]]
name = "sqlite_batch_insert"
harness = false

[[bench]]
name = "event_bus_throughput"
harness = false

[[bench]]
name = "http_routes"
harness = false

[[bench]]
name = "sqlite_queries"
harness = false

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "policy_engine"
harness = false

[[bench]]
name = "pqc_crypto"
harness = false
