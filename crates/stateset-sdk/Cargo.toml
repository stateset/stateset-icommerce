[package]
name = "stateset-sdk"
description = "Unified SDK facade for StateSet iCommerce — re-exports all crates with feature-gated includes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["commerce", "sdk", "stateset"]
categories = ["api-bindings"]

[dependencies]
# Always included (core)
stateset-primitives = { workspace = true, optional = true }
stateset-core = { workspace = true, optional = true }
stateset-db = { workspace = true, optional = true }
stateset-embedded = { workspace = true, optional = true }
stateset-observability = { workspace = true, optional = true }

# Feature-gated
stateset-crypto = { workspace = true, optional = true }
stateset-policy = { workspace = true, optional = true }
stateset-macros = { workspace = true, optional = true }
stateset-sync = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
default = ["core"]
core = [
    "dep:stateset-primitives",
    "dep:stateset-core",
    "dep:stateset-db",
    "dep:stateset-embedded",
    "dep:stateset-observability",
]
full = ["core", "crypto", "policy", "macros", "sync"]
crypto = ["dep:stateset-crypto"]
policy = ["dep:stateset-policy"]
macros = ["dep:stateset-macros"]
sync = ["dep:stateset-sync", "dep:serde", "dep:serde_json", "dep:uuid"]

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
