[package]
name = "stateset-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "VES v1.0 cryptographic operations for StateSet Commerce"
readme = "README.md"
keywords = ["cryptography", "ed25519", "post-quantum", "jcs", "merkle"]
categories = ["cryptography"]

[lints]
workspace = true

[features]
default = ["pqc"]
pqc = ["dep:ml-kem", "dep:ml-dsa"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
once_cell = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true, features = ["serde"] }
base64 = { workspace = true }
uuid = { workspace = true }
# ECMAScript Number::toString formatting for RFC 8785 §3.2.2.3 (the same
# algorithm serde_jcs used; the rest of JCS is hand-rolled in canonicalize.rs
# because serde_jcs 0.1.0 sorts object keys by escaped form — see that module).
ryu-js = "1.0"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
ml-kem = { version = "0.3.2", features = ["zeroize"], optional = true }
ml-dsa = { version = "0.1.1", features = ["zeroize"], optional = true }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = "1.4"
