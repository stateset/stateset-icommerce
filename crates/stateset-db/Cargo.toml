[package]
name = "stateset-db"
description = "Database implementations for StateSet iCommerce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["commerce", "ecommerce", "database", "sqlite", "postgresql"]
categories = ["database"]

[dependencies]
stateset-core = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SQLite dependencies (optional)
rusqlite = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
r2d2_sqlite = { workspace = true, optional = true }

# PostgreSQL dependencies (optional)
#
# Keep SQLx lean: don't enable its default features (notably `any`), which pull
# in unused drivers (MySQL, SQLite) and complicate dependency audit.
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio", "postgres", "macros", "json", "uuid", "chrono", "rust_decimal", "tls-none"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
rust_decimal_macros = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
insta = "1.46"

[[bench]]
name = "db_benchmarks"
harness = false

[lints]
workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:r2d2", "dep:r2d2_sqlite"]
postgres = ["dep:sqlx", "dep:tokio", "stateset-core/sqlx-postgres"]
vector = ["sqlite", "stateset-core/embeddings"]
# Experimental: persisted saga coordinator for multi-step orchestration.
# Kept behind an explicit feature to avoid forcing downstream users to provision
# a database connection at compile time.
saga = ["postgres"]
