[package]
name = "stateset-ffi"
description = "C-ABI oriented interop surface for stateset-embedded and sync runtime helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ffi", "commerce", "c-api", "bindings", "interop"]
categories = ["external-ffi-bindings"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
stateset-primitives = { workspace = true }
stateset-core = { workspace = true }
stateset-embedded = { workspace = true }
# Not `workspace = true`: cargo cannot override the workspace entry's
# default-features, and this crate needs the SDK without defaults.
stateset-sdk = { path = "../stateset-sdk", version = "1.27.0", default-features = false, features = ["sync"] }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true

[features]
default = []
cbindgen = []

[dev-dependencies]
async-trait = { workspace = true }
rust_decimal_macros = "1.36"
chrono = { workspace = true }
tempfile = { workspace = true }
