[package]
name = "stateset-primitives"
description = "Strongly-typed primitive types for StateSet iCommerce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["commerce", "ecommerce", "types", "newtype", "domain"]
categories = ["data-structures"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
proptest = { version = "1.4", optional = true }
proptest-derive = { version = "0.5", optional = true }
sqlx = { workspace = true, optional = true, default-features = false, features = ["postgres", "uuid"] }

[dev-dependencies]
serde_json = { workspace = true }
rust_decimal_macros = { workspace = true }
proptest = "1.4"
proptest-derive = "0.5"

[features]
default = ["std"]
std = []
arbitrary = ["dep:proptest", "dep:proptest-derive"]
sqlx-postgres = ["dep:sqlx"]
