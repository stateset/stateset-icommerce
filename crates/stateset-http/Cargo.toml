[package]
name = "stateset-http"
description = "HTTP service layer (REST + SSE) for the StateSet commerce engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["commerce", "http", "rest", "axum", "sse"]
categories = ["web-programming::http-server"]

[dependencies]
stateset-core = { workspace = true }
stateset-embedded = { workspace = true }
stateset-primitives = { workspace = true }
stateset-a2a = { path = "../stateset-a2a", version = "1.0.3" }
stateset-authz = { path = "../stateset-authz", version = "1.0.3" }

axum = { version = "0.8", features = ["json", "query"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace", "request-id", "timeout", "util"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["time"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
http = "1"
http-body-util = "0.1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
base64 = "0.22"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rust_decimal_macros = "1.36"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures = "0.3"
