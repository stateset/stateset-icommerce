[package]
name = "stateset-policy"
description = "Declarative policy engine for StateSet iCommerce — conditions, rules, deny-overrides, and explainable denials"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["commerce", "policy", "rules-engine", "access-control"]
categories = ["algorithms"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
regex = "1"
smallvec = "1"
tracing = "0.1"
rust_decimal = { workspace = true }

# Optional YAML support
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3.10"
proptest = "1.4"

[features]
default = ["yaml"]
yaml = ["dep:serde_yaml"]

[lints]
workspace = true
