[package]
name = "stateset-core"
description = "Core domain models and business logic for StateSet iCommerce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["commerce", "ecommerce", "orders", "inventory", "domain-model"]
categories = ["data-structures"]

[dependencies]
stateset-primitives = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
auto_impl = { workspace = true }
async-trait = { workspace = true }
strum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rs_merkle = "1"
once_cell = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }

# Optional embedding service dependencies
reqwest = { workspace = true, optional = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tokio = { workspace = true }
insta = { workspace = true }
stateset-test-utils = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false

[lints]
workspace = true

[features]
default = []
embeddings = ["dep:reqwest"]
metrics = ["dep:once_cell", "dep:prometheus"]
## Expose test helpers (for use in downstream integration tests)
test-utils = []
sqlx-postgres = ["stateset-primitives/sqlx-postgres"]
