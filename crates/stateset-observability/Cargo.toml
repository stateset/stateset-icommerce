[package]
name = "stateset-observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Observability utilities for StateSet iCommerce (metrics + tracing)"
readme = "README.md"
keywords = ["commerce", "observability", "tracing", "metrics"]
categories = ["development-tools::profiling"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# OpenTelemetry (optional — enable with `otel` feature)
opentelemetry = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }

[features]
default = []
otel = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
