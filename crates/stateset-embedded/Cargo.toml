[package]
name = "stateset-embedded"
description = "Embeddable commerce library - the SQLite of commerce operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
autobenches = false

[dependencies]
stateset-core = { workspace = true }
stateset-db = { workspace = true }
stateset-observability = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.23", optional = true }
opentelemetry-otlp = { version = "0.16", optional = true }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.24", optional = true }
metrics = "0.23"
prometheus = { workspace = true, optional = true }
# This is only used when the `postgres` feature is enabled (for the async event store).
# Keep it lean and avoid SQLx default features (notably `any`).
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono", "rust_decimal", "tls-none"] }

# Event streaming dependencies
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# SQLite event store
r2d2 = { workspace = true, optional = true }
r2d2_sqlite = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = ["sqlite", "events"]
sqlite = ["stateset-db/sqlite"]
postgres = ["stateset-db/postgres", "sqlx"]
events = ["reqwest/rustls-tls", "hmac", "sha2", "hex"]
sqlite-events = ["events", "r2d2", "r2d2_sqlite", "rusqlite"]
vector = ["stateset-db/vector", "stateset-core/embeddings"]

[dev-dependencies]
tempfile = "3.10"
rust_decimal_macros = "1.36"
tokio = { version = "1.0", features = ["rt", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.34", features = ["json"] }
proptest = "1.4"

[[bench]]
name = "api_benchmarks"
harness = false

[[bench]]
name = "performance_benchmarks"
harness = false

[[example]]
name = "basic_usage"
path = "../../examples/basic_usage.rs"
