[package]
name = "stateset-embedded"
description = "Embeddable commerce library - the SQLite of commerce operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["commerce", "ecommerce", "embedded", "ai-agents", "sqlite"]
categories = ["database"]
autobenches = false

[dependencies]
stateset-core = { workspace = true }
stateset-db = { workspace = true }
stateset-observability = { workspace = true }
stateset-pricing = { path = "../stateset-pricing", version = "1.0.4" }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Async stack — now optional and gated behind the `async` feature. The
# core SQLite commerce path doesn't touch either (every tokio/futures
# use in this crate sits inside `#[cfg(feature = "events")]` or
# `#[cfg(feature = "postgres")]`). Embedders targeting CLI tools, WASM,
# or minimal binaries can `default-features = false, features = ["sqlite"]`
# to drop ~3 MB of async runtime from the final artifact.
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time"], optional = true }
futures = { version = "0.3", optional = true }
tracing = "0.1"
# This is only used when the `postgres` feature is enabled (for the async event store).
# Keep it lean and avoid SQLx default features (notably `any`).
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono", "rust_decimal", "tls-rustls-ring-native-roots"] }

# Event streaming dependencies
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

# SQLite event store
r2d2 = { workspace = true, optional = true }
r2d2_sqlite = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = ["sqlite", "events"]
# Pulls in tokio + futures. Implied by every feature that does async
# work, so direct opt-in is rare — embedders usually only see `async`
# via `events` or `postgres`. Present as a standalone feature so that
# a future async-only capability can be added without plumbing a new
# feature gate.
async = ["dep:tokio", "dep:futures"]
sqlite = ["stateset-db/sqlite", "stateset-core/rusqlite"]
postgres = ["stateset-db/postgres", "sqlx", "async"]
events = ["reqwest/rustls-tls", "reqwest/blocking", "hmac", "sha2", "hex", "async"]
sqlite-events = ["events", "r2d2", "r2d2_sqlite", "rusqlite"]
otel = ["stateset-observability/otel"]
vector = ["stateset-db/vector", "stateset-core/embeddings"]

[dev-dependencies]
stateset-crypto = { workspace = true }
tempfile = "3.10"
rust_decimal_macros = "1.36"
tokio = { version = "1.0", features = ["rt", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.34", features = ["json"] }
proptest = "1.4"

[[bench]]
name = "api_benchmarks"
harness = false
required-features = ["sqlite"]

[[bench]]
name = "performance_benchmarks"
harness = false
required-features = ["sqlite"]

[[example]]
name = "basic_usage"
path = "../../examples/basic_usage.rs"
required-features = ["sqlite"]
