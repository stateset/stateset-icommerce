    "target",
    "node_modules",
    "Cargo.toml",
    "Cargo.lock",
    "*.json",
    "*.js",
    "*.css",
    "*.html",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
]

