[files]
extend-exclude = [
    ".git",
    "target",
    "node_modules",
    "Cargo.toml",
    "Cargo.lock",
    "*.json",
    "*.js",
    "*.css",
    "*.html",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
    # cargo-vet store: machine-generated crate names/versions (e.g. flate2)
    # trip the spell-checker by construction.
    "supply-chain/",
]

[default.extend-words]
ser = "ser"
ratatui = "ratatui"
Caf = "Caf"
froms = "froms"
strat = "strat"
ba = "ba"
consts = "consts"
ANC = "ANC"
JOD = "JOD"
ND = "ND"
VND = "VND"
aways = "aways"
mape = "mape"
Observ = "Observ"
# `icp_ful` is an intentional ICP event/ID prefix (fulfillment), matching the
# sibling `icp_evt`, `icp_set`, `icp_sub`, ... three-letter prefix convention.
ful = "ful"
# Plural collection-style locals in DB filter tests (`pendings`, `expireds`)
# mirror the accepted `actives`/`cancelleds` siblings in the same test fns.
pendings = "pendings"
expireds = "expireds"
# ZPL printer-language command (^FO = Field Origin) in print-station test payloads.
FO = "FO"
# `REORD-*` SKU prefixes in inventory reorder-point tests.
REORD = "REORD"

[default.extend-identifiers]
# Proper noun (HashiCorp Vault) and an intentional acronym stylization
# ("AID" = Agent IDentifier) in ICP spec prose.
HashiCorp = "HashiCorp"
IDentifier = "IDentifier"
